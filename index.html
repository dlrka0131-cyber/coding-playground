<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>코딩 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Dongle:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-sky-top: #1D7FD1;
    --color-sky-mid: #56B4EA;
    --color-sky-horizon: #C7EEF7;
    --color-hill-near: #63C24B;
    --color-tree-near: #3EA33A;
    --color-trunk: #8B5A2B;
    --color-cloud: #FFFFFF;
    --color-star: #FFD34E;
    --color-star-shine: #FFE9A8;
    --color-accent: #FF6F91;
    --color-accent-deep: #FF4D73;
    --color-surface: #FFFBF2;
    --color-surface-alt: #FFFFFF;
    --color-text-on-sky: #FFFFFF;
    --color-text-on-surface: #33264A;
    --color-text-muted: #8A7C9C;
    --color-border: #FFD3DE;
    --color-shadow: rgba(255, 111, 145, 0.25);
    --color-flower-1: #FF9BB3;
    --color-flower-2: #FFE27A;
    --badge-mouse: #FFD9E8;
    --badge-mouse-deep: #F2568F;
    --badge-keyboard: #E7E4FF;
    --badge-keyboard-deep: #8A7BEA;
    --badge-copy: #FFE9D6;
    --badge-copy-deep: #F2924A;
    --badge-coord: #FFF4CB;
    --badge-coord-deep: #E0B32E;
    --badge-mc: #E1F0D8;
    --badge-mc-deep: #63A946;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--color-sky-horizon);
    font-family: 'Dongle', sans-serif;
    color: var(--color-text-on-surface);
    overflow: hidden;
  }

  .page {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* ---------- HERO ---------- */
  .hero {
    position: relative;
    flex: 0 0 52vh;
    height: 52vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }

  .sky {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, var(--color-sky-top) 0%, var(--color-sky-mid) 55%, var(--color-sky-horizon) 100%);
  }
  .sky::after {
    content: "";
    position: absolute;
    top: -8%;
    right: -8%;
    width: 55%;
    height: 65%;
    background: radial-gradient(circle, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0) 68%);
    pointer-events: none;
  }

  .star {
    position: absolute;
    width: var(--size, 6px);
    height: var(--size, 6px);
    background: var(--color-star);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    animation: twinkle var(--dur, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }

  .cloud {
    position: absolute;
    background: var(--color-cloud);
    border-radius: 999px;
    opacity: 0.92;
    filter: drop-shadow(0 6px 8px rgba(29, 127, 209, 0.12));
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: var(--color-cloud);
    border-radius: 999px;
  }
  .cloud-1 { top: 12%; left: -12%; width: 130px; height: 42px; animation: drift 70s linear infinite; }
  .cloud-1::before { width: 64px; height: 64px; top: -30px; left: 16px; }
  .cloud-1::after { width: 48px; height: 48px; top: -18px; left: 70px; }
  .cloud-2 { top: 22%; left: -12%; width: 96px; height: 34px; animation: drift 95s linear infinite; animation-delay: -30s; }
  .cloud-2::before { width: 48px; height: 48px; top: -20px; left: 10px; }
  .cloud-2::after { width: 38px; height: 38px; top: -14px; left: 50px; }
  .cloud-3 { top: 5%; left: -12%; width: 74px; height: 28px; animation: drift 60s linear infinite; animation-delay: -15s; }
  .cloud-3::before { width: 36px; height: 36px; top: -16px; left: 8px; }
  .cloud-3::after { width: 30px; height: 30px; top: -10px; left: 38px; }

  .mascot {
    position: absolute;
    top: 30%;
    right: 8%;
    width: 92px;
    height: 92px;
    animation: mascotBob 4.5s ease-in-out infinite;
  }
  .mascot-body {
    width: 100%;
    height: 100%;
    background: var(--color-star);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    position: relative;
    filter: drop-shadow(0 10px 16px rgba(51, 38, 74, 0.2));
  }
  .mascot-shine { position: absolute; top: 20%; left: 30%; width: 22%; height: 22%; background: var(--color-star-shine); border-radius: 50%; opacity: 0.8; }
  .mascot-face { position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%); width: 38px; height: 24px; }
  .mascot-cheek { position: absolute; top: 4px; width: 9px; height: 6px; background: var(--color-accent); border-radius: 50%; opacity: 0.55; }
  .mascot-cheek.left { left: -6px; }
  .mascot-cheek.right { right: -6px; }
  .mascot-eye { position: absolute; top: 0; width: 6px; height: 6px; border-radius: 50%; background: #2B2038; }
  .mascot-eye.left { left: 10px; }
  .mascot-eye.right { right: 10px; }
  .mascot-smile { position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); width: 16px; height: 8px; border: 2.5px solid #2B2038; border-top: none; border-radius: 0 0 14px 14px; }
  .sparkle { position: absolute; background: #FFFFFF; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: twinkle 2.2s ease-in-out infinite; }
  .mascot .sparkle.s1 { width: 12px; height: 12px; top: -14px; left: -16px; animation-delay: 0.3s; }
  .mascot .sparkle.s2 { width: 8px; height: 8px; bottom: -6px; right: -14px; animation-delay: 1s; }

  .hills { position: absolute; left: 0; right: 0; bottom: -2px; z-index: 2; line-height: 0; }
  .hill { display: block; width: 100%; height: 11vh; }
  .hill-near { fill: var(--color-hill-near); }

  .tree { position: absolute; z-index: 2; }
  .tree .blob { position: absolute; border-radius: 50%; background: var(--tone); }
  .tree .b1 { width: 34px; height: 34px; left: 0; top: 6px; }
  .tree .b2 { width: 26px; height: 26px; left: 20px; top: -6px; }
  .tree .b3 { width: 28px; height: 28px; left: -6px; top: -10px; }
  .tree .trunk { position: absolute; width: 6px; height: 14px; background: var(--color-trunk); left: 14px; top: 30px; border-radius: 2px; }

  .flower { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--tone); z-index: 2; }
  .flower::after { content: ""; position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--color-flower-2); top: 3px; left: 3px; }

  .hero-content {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 0 24px;
    max-width: 90vw;
    margin: 6vh auto 0;
  }
  .eyebrow {
    font-family: 'Dongle', sans-serif;
    font-weight: 700;
    font-size: clamp(17px, 3.2vh, 25px);
    color: var(--color-text-on-sky);
    background: rgba(255,255,255,0.22);
    display: inline-block;
    padding: 5px 22px;
    border-radius: 999px;
    margin: 0 0 12px;
  }
  h1 {
    font-family: 'Baloo 2', 'Dongle', sans-serif;
    font-weight: 800;
    font-size: clamp(44px, 12vh, 128px);
    color: #FFFFFF;
    margin: 0 0 16px;
    text-wrap: balance;
    letter-spacing: 1px;
    line-height: 1.05;
    text-shadow:
      -3px -3px 0 var(--color-accent-deep),
       3px -3px 0 var(--color-accent-deep),
      -3px  3px 0 var(--color-accent-deep),
       3px  3px 0 var(--color-accent-deep),
       0 12px 24px rgba(31, 22, 55, 0.35);
  }
  .tagline {
    font-family: 'Dongle', sans-serif;
    font-weight: 700;
    font-size: clamp(19px, 3.6vh, 30px);
    color: var(--color-text-on-sky);
    margin: 0;
    text-shadow: 0 2px 6px rgba(31, 22, 55, 0.3);
  }

  /* ---------- QUESTS ---------- */
  .quests {
    background: var(--color-hill-near);
    padding: 0.4vh 24px;
    margin-top: -2px;
    position: relative;
    z-index: 3;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
  }
  .quest-grid {
    width: 100%;
    max-width: 1320px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: clamp(10px, 2.2vh, 28px) clamp(14px, 2.2vw, 28px);
  }
  .quest-card {
    position: relative;
    z-index: 1;
    background: var(--color-surface);
    border: 3px solid var(--color-border);
    border-radius: 32px;
    padding: clamp(18px, 4.4vh, 44px) 16px clamp(16px, 3.4vh, 36px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    box-shadow: 0 12px 12px var(--color-shadow);
    transform: translateY(0);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
    cursor: pointer;
    text-decoration: none;
  }
  .quest-card:hover, .quest-card:focus-visible {
    z-index: 20;
    transform: translateY(-4px);
    background: var(--badge);
    box-shadow: 0 18px 18px var(--color-shadow);
    border-color: var(--badge-deep);
    outline: none;
  }
  .quest-badge {
    width: clamp(54px, 11.5vh, 104px);
    height: clamp(54px, 11.5vh, 104px);
    border-radius: 50%;
    background: var(--badge);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(28px, 5.6vh, 50px);
    margin-bottom: clamp(8px, 1.8vh, 20px);
    transition: background-color 0.25s ease;
  }
  .quest-card:hover .quest-badge, .quest-card:focus-visible .quest-badge {
    background: #FFFFFF;
  }
  .quest-card h2 {
    font-family: 'Dongle', sans-serif;
    font-weight: 700;
    font-size: clamp(25px, 5.4vh, 44px);
    color: var(--color-text-on-surface);
    margin: 0 0 2px;
    transition: color 0.25s ease;
  }
  .quest-card p {
    font-family: 'Dongle', sans-serif;
    font-size: clamp(17px, 3.6vh, 26px);
    color: var(--color-text-muted);
    margin: 0;
    transition: color 0.25s ease;
  }
  .quest-card:hover h2, .quest-card:focus-visible h2 {
    color: var(--color-text-on-surface);
  }
  .quest-card:hover p, .quest-card:focus-visible p {
    color: var(--color-text-on-surface);
    opacity: 0.75;
  }

  footer {
    background: var(--color-hill-near);
    text-align: center;
    flex: 0 0 auto;
    padding: clamp(8px, 1.4vh, 14px) 24px clamp(10px, 2vh, 22px);
    font-family: 'Dongle', sans-serif;
    font-weight: 700;
    font-size: clamp(17px, 2.8vh, 24px);
    color: var(--color-text-on-sky);
    text-shadow: 0 1px 3px rgba(31, 22, 55, 0.25);
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.15); }
  }
  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(140vw); }
  }
  @keyframes mascotBob {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-12px) rotate(4deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .star, .cloud, .mascot, .sparkle { animation: none !important; }
  }

  @media (max-width: 640px) {
    .tree { display: none; }
    .mascot { top: 22%; right: 8%; width: 66px; height: 66px; }
  }
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <div class="sky">
      <span class="star" style="top:10%; left:8%; --size:8px; --dur:3.2s; --delay:0s;"></span>
      <span class="star" style="top:18%; left:22%; --size:5px; --dur:2.6s; --delay:0.6s;"></span>
      <span class="star" style="top:8%; left:38%; --size:6px; --dur:3.6s; --delay:1.1s;"></span>
      <span class="star" style="top:26%; left:48%; --size:5px; --dur:2.8s; --delay:0.3s;"></span>
      <span class="star" style="top:14%; left:62%; --size:7px; --dur:3.1s; --delay:0.9s;"></span>
      <span class="star" style="top:34%; left:78%; --size:5px; --dur:2.4s; --delay:1.4s;"></span>
      <span class="star" style="top:6%; left:88%; --size:6px; --dur:3.4s; --delay:0.2s;"></span>
      <span class="star" style="top:30%; left:4%; --size:5px; --dur:2.9s; --delay:1.6s;"></span>
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="mascot" aria-hidden="true">
        <span class="sparkle s1"></span>
        <span class="sparkle s2"></span>
        <div class="mascot-body">
          <div class="mascot-shine"></div>
          <div class="mascot-face">
            <span class="mascot-cheek left"></span>
            <span class="mascot-cheek right"></span>
            <span class="mascot-eye left"></span>
            <span class="mascot-eye right"></span>
            <span class="mascot-smile"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="hills">
      <svg class="hill hill-near" viewBox="0 0 1440 220" preserveAspectRatio="none">
        <path d="M0,120 C180,80 300,150 480,120 C660,90 800,150 960,120 C1140,90 1260,140 1440,110 L1440,220 L0,220 Z"></path>
      </svg>
    </div>

    <div class="tree" style="left:10%; bottom:34px; transform:scale(0.85); --tone:var(--color-tree-near);">
      <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="trunk"></span>
    </div>
    <div class="tree" style="left:88%; bottom:34px; transform:scale(0.75); --tone:var(--color-tree-near);">
      <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="trunk"></span>
    </div>
    <span class="flower" style="left:26%; bottom:44px; --tone:var(--color-flower-1);"></span>
    <span class="flower" style="left:47%; bottom:54px; --tone:var(--color-flower-2);"></span>
    <span class="flower" style="left:66%; bottom:40px; --tone:var(--color-flower-1);"></span>

    <div class="hero-content">
      <p class="eyebrow">김정이 선생님과 함께 코딩 놀이터</p>
      <h1>CODING PLAYGROUND</h1>
      <p class="tagline">마우스는 딸깍! 키보드는 타닥타닥! 신나는 코딩 모험, 출발!</p>
    </div>
  </section>

  <section class="quests">
    <div class="quest-grid">
      <a href="mouse_menu.html" class="quest-card" style="--badge: var(--badge-mouse); --badge-deep: var(--badge-mouse-deep)">
        <div class="quest-badge">🖱️</div>
        <h2>마우스 연습</h2>
        <p>더블클릭·휠·드래그</p>
      </a>
      <a href="key_menu.html" class="quest-card" style="--badge: var(--badge-keyboard); --badge-deep: var(--badge-keyboard-deep)">
        <div class="quest-badge">⌨️</div>
        <h2>키보드 연습</h2>
        <p>타이핑과 단축키</p>
      </a>
      <a href="copy_menu.html" class="quest-card" style="--badge: var(--badge-copy); --badge-deep: var(--badge-copy-deep)">
        <div class="quest-badge">📋</div>
        <h2>복사 붙여넣기</h2>
        <p>Ctrl+C, Ctrl+V</p>
      </a>
      <a href="xy_menu.html" class="quest-card" style="--badge: var(--badge-coord); --badge-deep: var(--badge-coord-deep)">
        <div class="quest-badge">🌟</div>
        <h2>좌표 연습</h2>
        <p>x, y 콕 집어보기</p>
      </a>
      <a href="mc_menu.html" class="quest-card" style="--badge: var(--badge-mc); --badge-deep: var(--badge-mc-deep)">
        <div class="quest-badge">⛏️</div>
        <h2>마크 명령어 연습</h2>
        <p>마인크래프트 명령어</p>
      </a>
    </div>
  </section>

  <footer>제작: 김정이 선생님 ❤️ | © 2026 Coding Playground</footer>
</div>
</body>
</html>
