<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="common.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엔트리 퀴즈대회 연습</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Pretendard', sans-serif;
            background: #fff0ee;
            margin: 0; height: 100vh; overflow-x: hidden; overflow-y: auto;
            display: flex; flex-direction: column;
            user-select: none; color: #4a3b2c; line-height: 1.6; letter-spacing: .01em; word-break: keep-all;
        }
        .home-btn { background: #fff; color: #e5594a; border-color: #e5594a; top: 14px; left: 14px; padding: 8px 22px; font-size: 20px;
            border-width: 3px; font-family: inherit; font-weight: 800; }
        .home-btn:hover { background: #e5594a; color: #fff; }

        #wrap { flex: 1; min-height: 0; width: 100%; max-width: 1560px; margin: 0 auto; padding: 1.5vh 20px 0; text-align: center; display: flex; flex-direction: column; }
        h1 { font-size: clamp(28px, 5.4vh, 50px); margin: 0; color: #e5594a; font-weight: 900; line-height: 1.2; }
        .subtitle { font-size: clamp(14px, 2.5vh, 23px); color: #6b5844; margin: .5vh 0 1.4vh; font-weight: 600; }

        .panel { flex: 1; min-height: 0; background: #fff; border: 5px solid #ff9f93; border-radius: 32px; padding: 1.4vh 28px 1.6vh;
            display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.4vh, 16px); }
        .screen { width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.4vh, 16px); }
        .screen[hidden] { display: none; }

        /* ---------- 입장 ---------- */
        .entry { justify-content: center; gap: clamp(10px, 2.6vh, 28px); }
        .entry .lead { font-size: clamp(20px, 4vh, 36px); font-weight: 800; }
        .nameinput { font-family: inherit; font-weight: 800; font-size: clamp(22px, 4.4vh, 40px); text-align: center; width: min(420px, 80%);
            padding: 1vh 16px; border: 4px solid #ff9f93; border-radius: 20px; color: #4a3b2c; outline: none; user-select: text; }
        .nameinput:focus { border-color: #e5594a; }
        .emojis { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .emo { font-size: clamp(28px, 6vh, 56px); line-height: 1; padding: .8vh 1.4vh; border-radius: 20px; border: 4px solid #ffe1dc; background: #fff8f6; cursor: pointer; font-family: inherit; }
        .emo:hover { transform: translateY(-3px); }
        .emo.on { border-color: #e5594a; background: #ffe1dc; transform: scale(1.1); }
        .err { color: #e0345a; font-weight: 800; font-size: clamp(15px, 2.8vh, 24px); min-height: 1.5em; }

        /* ---------- 문제 ---------- */
        .qhead { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .chip { background: #fff0ee; border: 3px solid #ffd0c9; border-radius: 999px; padding: .1vh 18px; font-size: clamp(14px, 2.6vh, 22px); font-weight: 800; }
        .qtitle { font-size: clamp(22px, 4.6vh, 44px); font-weight: 900; line-height: 1.3; }
        .qline { margin: .8vh 0 clamp(8px, 2vh, 22px); display: flex; align-items: center; justify-content: center; gap: clamp(12px, 2vw, 28px); flex-wrap: wrap; width: 100%; }
        .mission { display: flex; align-items: center; gap: 12px; background: #fff3c4; border: 3px solid #ffc933; border-radius: 18px; padding: .6vh 18px; text-align: left; box-shadow: 0 4px 0 #f0b400; }
        .mtag { background: #ff9f1c; color: #fff; font-weight: 900; font-size: clamp(14px, 2.8vh, 24px); border-radius: 999px; padding: .1vh 14px; white-space: nowrap; }
        .mtext { font-size: clamp(16px, 3.3vh, 30px); font-weight: 800; color: #3a2d20; line-height: 1.4; }
        .qdesc { font-size: clamp(14px, 2.6vh, 24px); line-height: 1.4; font-weight: 600; color: #6b5844; }

        .cols { width: 100%; flex: 1; min-height: 0; display: grid; grid-template-columns: 1.15fr 1fr .8fr; gap: 16px; }
        .col { display: flex; flex-direction: column; min-height: 0; background: #fffaf8; border: 3px solid #ffe1dc; border-radius: 22px; padding: 1vh 14px 1.2vh; }
        .col h2 { margin: 0 0 .6vh; font-size: clamp(15px, 2.8vh, 24px); font-weight: 800; }
        .col h2 small { color: #6b5844; font-weight: 600; font-size: .8em; }
        .zone { flex: 1; min-height: 0; border-radius: 16px; position: relative; }
        .pool { background: #fff6e6; border: 3px dashed #f0dcc0; overflow: hidden; }
        .pool .blk { position: absolute; }
        .build { background: #f1f9ff; border: 3px dashed #9ad4f2; padding: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; overflow: hidden; }
        .zone.over { background: #e6f4ff; }
        .empty { margin: auto; align-self: center; color: #6b5844; font-weight: 600; font-size: clamp(14px, 2.6vh, 22px); text-align: center; position: static; }
        .pool .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

        .blk { user-select: none; touch-action: none; cursor: grab; color: #fff; font-weight: 800; font-size: clamp(14px, 2.9vh, 24px); white-space: nowrap;
            padding: .75vh 14px; border-radius: 10px; background: var(--c); box-shadow: 0 4px 0 rgba(0,0,0,.22); line-height: 1.4; }
        .blk:hover { filter: brightness(1.08); }
        .blk.in1 { margin-left: clamp(18px, 4vh, 34px); }
        .blk.dragging { position: fixed !important; z-index: 99; cursor: grabbing; box-shadow: 0 12px 20px rgba(0,0,0,.28); transform: scale(1.04) rotate(0) !important; pointer-events: none; }
        .blk.bad { animation: shake .4s; outline: 4px solid #ff4d6d; outline-offset: 2px; }
        @keyframes shake { 25% { translate: -6px 0; } 75% { translate: 6px 0; } }
        .start { --c: #0db33c; } .flow { --c: #3dbbea; } .looks { --c: #ff3d64; } .move { --c: #a94af0; } .brush { --c: #ff9b00; }

        /* 무대 */
        .stage { flex: 1; min-height: 0; border-radius: 16px; background: linear-gradient(#bfe8ff, #e8f8ff); border: 3px solid #9ad4f2; position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center; font-size: clamp(54px, 13vh, 120px); line-height: 1; }
        .stage .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 12%; background: #7ccf5a; }
        .stage .obj { position: absolute; font-size: clamp(34px, 8vh, 72px); line-height: 1; }
        .stage.play .obj.bounce { animation: bx 1.8s linear infinite alternate; }
        .stage.play .obj.orbit { animation: orb 3s linear infinite; }
        @keyframes bx { from { left: 6%; } to { left: calc(94% - 1.1em); } }
        @keyframes orb { from { transform: rotate(0) translateX(clamp(26px, 7vh, 62px)) rotate(0); } to { transform: rotate(360deg) translateX(clamp(26px, 7vh, 62px)) rotate(-360deg); } }
        .stage .obj.tp { transition: left .15s, top .15s; }
        .stage.play .obj.spin { animation: spinr 1.6s linear infinite; }
        @keyframes spinr { to { transform: rotate(360deg); } }
        .stage.play .obj.grow { animation: growp .9s ease-in-out infinite alternate; }
        @keyframes growp { from { transform: scale(.6); } to { transform: scale(1.6); } }
        .stage.play .obj.wander { animation: wander 4s ease-in-out infinite; }
        @keyframes wander { 0%, 100% { left: 15%; top: 25%; } 25% { left: 65%; top: 20%; } 50% { left: 70%; top: 60%; } 75% { left: 25%; top: 65%; } }
        .bubble { position: absolute; top: 8%; left: 50%; transform: translateX(-50%); background: #fff; border: 3px solid #4a3b2c; border-radius: 16px;
            padding: .3vh 14px; font-size: clamp(13px, 2.6vh, 22px); font-weight: 800; white-space: nowrap; line-height: 1.4; }
        .cnt { font-size: clamp(40px, 11vh, 100px); font-weight: 900; color: #e5594a; line-height: 1; }
        .stage svg { width: 70%; height: 70%; }
        .stage svg path { fill: none; stroke: #e5594a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 240; stroke-dashoffset: 240; animation: drw 3s linear infinite; }
        @keyframes drw { 0% { stroke-dashoffset: 240; } 80%, 100% { stroke-dashoffset: 0; } }
        .stagetxt { margin-top: .6vh; font-size: clamp(13px, 2.4vh, 20px); font-weight: 600; color: #6b5844; min-height: 3em; line-height: 1.45; }

        .actions { margin-top: clamp(6px, 1.6vh, 18px); display: flex; gap: 18px; justify-content: center; align-items: center; flex-wrap: wrap; }
        .btn { font-family: inherit; font-weight: 800; font-size: clamp(18px, 3.6vh, 32px); border: 0; border-radius: 999px; padding: 1.1vh 38px; color: #fff; cursor: pointer; letter-spacing: .03em; }
        .go { background: #ff7fa8; box-shadow: 0 5px 0 #e35d8a; }
        .nx { background: #3ccf7a; box-shadow: 0 5px 0 #2aa862; }
        .rs { background: #9aa5b1; box-shadow: 0 5px 0 #7b8693; }
        .btn:active { transform: translateY(4px); }
        .btn[hidden] { display: none; }
        .msg { min-height: 1.4em; font-size: clamp(15px, 3vh, 26px); font-weight: 700; color: #e0345a; line-height: 1.4; }

        /* ---------- 결과 ---------- */
        .result { justify-content: center; gap: clamp(8px, 2vh, 22px); }
        .rbig { font-size: clamp(24px, 5vh, 48px); font-weight: 900; }
        .rtable { border-collapse: separate; border-spacing: 0 3px; font-size: clamp(13px, 2.4vh, 22px); font-weight: 700; line-height: 1.3; }
        .rtable th { color: #6b5844; font-size: .8em; padding: 0 22px; }
        .rtable td { background: #fff0ee; padding: .3vh 22px; }
        .rtable td:first-child { border-radius: 14px 0 0 14px; } .rtable td:last-child { border-radius: 0 14px 14px 0; }
        .rtotal { font-size: clamp(20px, 4vh, 38px); font-weight: 900; color: #e5594a; }

        /* ---------- 정답 팝업 ---------- */
        .celebrate { position: fixed; inset: 0; pointer-events: none; z-index: 150; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .celebrate .big { font-size: clamp(80px, 26vh, 260px); font-weight: 900; letter-spacing: -2px; white-space: nowrap;
            background: linear-gradient(90deg, #ff5e8a, #ffb02e, #3ccf7a, #3aa6e8, #8e7dff, #ff5e8a); background-size: 200% 100%;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 6px 0 rgba(255,255,255,.9)) drop-shadow(0 10px 18px rgba(0,0,0,.28));
            animation: pop 1.7s ease-out forwards, shine 1.2s linear infinite; }
        @keyframes pop { 0% { transform: scale(0) rotate(-14deg); opacity: 0; } 22% { transform: scale(1.3) rotate(5deg); opacity: 1; }
            36% { transform: scale(.95) rotate(-3deg); } 48% { transform: scale(1.05) rotate(1deg); } 62% { transform: scale(1) rotate(0); opacity: 1; }
            100% { transform: scale(1.15); opacity: 0; } }
        @keyframes shine { to { background-position: -200% 0; } }
        .celebrate .flash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,236,150,.75), rgba(255,236,150,0) 62%); animation: flash 1.2s ease-out forwards; }
        @keyframes flash { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.6); } }
        .lvrow { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        .lvpick { font-family: inherit; cursor: pointer; border: 4px solid #ffd0c9; background: #fff8f6; color: #4a3b2c; border-radius: 22px; padding: 1vh 34px; font-size: clamp(20px, 4vh, 36px); font-weight: 900; line-height: 1.3; }
        .lvpick small { display: block; font-size: .5em; font-weight: 700; color: #6b5844; }
        .lvpick.on { background: #e5594a; border-color: #e5594a; color: #fff; }
        .lvpick.on small { color: #ffe7e3; }
        .zone.dense { gap: 4px; padding: 8px; }
        .zone.dense .blk { padding: .45vh 12px; font-size: clamp(13px, 2.45vh, 21px); }
        .footer { margin: 0 !important; line-height: 1.3 !important; padding: .6vh 0; font-size: 14px !important; font-family: inherit !important; }

        @media (max-width: 900px) { .cols { grid-template-columns: 1fr 1fr; } .col.stagecol { display: none; } }
    </style>
</head>
<body>
    <a href="index.html" class="home-btn">🏠 처음으로</a>

    <div id="wrap">
        <h1>엔트리 퀴즈대회 연습</h1>
        <div class="subtitle">흩어진 블록을 끌어다 알맞게 조립해 보세요!</div>

        <div class="panel">
            <!-- 입장 -->
            <div class="screen entry" id="sEntry">
                <div class="lead">이름을 쓰고 단계를 골라요!</div>
                <input class="nameinput" id="name" maxlength="8" placeholder="내 이름" autocomplete="off">
                <div class="lvrow" id="lvrow"></div>
                <div class="err" id="err"></div>
                <button class="btn go" id="startBtn">시작하기!</button>
            </div>

            <!-- 문제 -->
            <div class="screen" id="sQuiz" hidden>
                <div class="qhead">
                    <div class="chip" id="who"></div>
                    <div class="chip" id="qnum"></div>
                    <div class="chip">⏱ <span id="time">0.0</span>초</div>
                </div>
                <div class="qline">
                    <div class="qtitle" id="qtitle"></div>
                    <div class="mission"><span class="mtag">🎯 미션</span><span class="mtext" id="qdesc"></span></div>
                </div>
                <div class="cols">
                    <div class="col"><h2>📦 흩어진 블록</h2><div class="zone pool" id="pool"></div></div>
                    <div class="col"><h2>🔧 조립대 <small>(위에서 아래로 실행돼요)</small></h2><div class="zone build" id="build"></div></div>
                    <div class="col stagecol"><h2>🎬 완성되면?</h2><div class="stage" id="stage"></div><div class="stagetxt" id="stagetxt"></div></div>
                </div>
                <div class="actions">
                    <button class="btn go" id="check">확인하기</button>
                    <button class="btn nx" id="next" hidden>다음 문제 ▶</button>
                    <button class="btn rs" id="again">처음부터</button>
                </div>
                <div class="msg" id="msg"></div>
            </div>

            <!-- 결과 -->
            <div class="screen result" id="sResult" hidden>
                <div class="rbig" id="rbig"></div>
                <table class="rtable" id="rtable"></table>
                <div class="rtotal" id="rtotal"></div>
                <button class="btn go" id="retry">다른 단계 도전!</button>
            </div>
        </div>
    </div>

    <div class="footer" style="color:#8a7660">제작: 김정이 선생님 ❤️ | © 2026 Coding Playground</div>

<script src="entry_quiz_data.js"></script>
<script>
let PROBS = LEVELS[0].probs, lv = 0;   // 단계별 10문제 (entry_quiz_data.js)

let who = {name:''}, pi = 0, pool, build, pos, solved, tries, t0, timer, anim, results = [], totalT0;
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const show = id => ['sEntry', 'sQuiz', 'sResult'].forEach(s => $(s).hidden = s !== id);

// ---------- 입장 ----------
function drawLevels() {
    $('lvrow').innerHTML = LEVELS.map((L, i) => `<button class="lvpick ${i === lv ? 'on' : ''}" data-i="${i}">${L.name}<small>${L.probs.length}문제</small></button>`).join('');
    $('lvrow').querySelectorAll('.lvpick').forEach(b => b.onclick = () => { lv = +b.dataset.i; drawLevels(); });
}
drawLevels();
function begin() {
    const n = $('name').value.trim();
    if (!n) { $('err').textContent = '이름을 써 주세요!'; $('name').focus(); return; }
    who.name = n; $('err').textContent = ''; results = []; pi = 0; totalT0 = Date.now(); PROBS = LEVELS[lv].probs;
    show('sQuiz'); loadProb();
}
$('startBtn').onclick = begin;
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') begin(); });

// ---------- 문제 ----------
function loadProb() {
    const P = PROBS[pi];
    solved = false; tries = 0; build = []; pos = {};
    pool = shuffle(P.ids);
    ['build', 'pool'].forEach(z => $(z).classList.toggle('dense', P.ids.length >= 6));
    pool.forEach((id, i) => pos[id] = {fx: Math.random(), fy: (i + Math.random() * .6) / pool.length, r: Math.random() * 6 - 3});
    $('who').textContent = `🙂 ${who.name}`;
    $('qnum').textContent = `${LEVELS[lv].name} · 문제 ${pi + 1} / ${PROBS.length}`;
    $('qtitle').textContent = `문제 ${pi + 1}. ${P.title}`; $('qdesc').textContent = P.desc;
    $('msg').textContent = ''; $('check').hidden = false; $('again').hidden = false; $('next').hidden = true;
    $('stagetxt').textContent = '정답을 맞히면 움직여요!';
    drawStage(false);
    t0 = Date.now(); clearInterval(timer);
    timer = setInterval(() => { if (!solved) $('time').textContent = Math.floor((Date.now() - t0) / 1000); }, 200);
    $('time').textContent = '0';
    render();
}

let stopStage = () => {};
function drawStage(play) { stopStage(); stopStage = eqStage($('stage'), PROBS[pi], play); }

function mk(id, where, idx, bad) {
    const d = document.createElement('div');
    d.className = `blk ${BL[id].c}`; d.dataset.id = id; d.textContent = BL[id].t;
    if (where === 'build') {
        const ind = PROBS[pi].indent;
        if (ind) { const n = ind[idx] || 0; if (n > 0) d.classList.add('in' + n); }
        else { const r = build.findIndex(x => CONT.includes(x)); if (r >= 0 && idx > r) d.classList.add('in1'); }
    }
    if (bad) d.classList.add('bad');
    if (!solved) d.addEventListener('pointerdown', e => startDrag(e, d, id, where));
    return d;
}

function render(badIdx) {
    const p = $('pool'), b = $('build'); p.innerHTML = ''; b.innerHTML = '';
    pool.forEach(id => p.appendChild(mk(id, 'pool')));
    build.forEach((id, i) => b.appendChild(mk(id, 'build', i, badIdx && badIdx.includes(i))));
    if (!pool.length) p.innerHTML = '<div class="empty">블록을 다 가져갔어요</div>';
    if (!build.length) b.innerHTML = '<div class="empty">여기로 블록을 끌어다 놓으세요</div>';
    // 흩어진 블록은 실제 크기를 잰 뒤에 영역 안 임의 위치에 놓아요
    const W = p.clientWidth, H = p.clientHeight;
    p.querySelectorAll('.blk').forEach(el => {
        const q = pos[el.dataset.id];
        el.style.left = Math.max(0, q.fx * (W - el.offsetWidth)) + 'px';
        el.style.top = Math.max(0, Math.min(H - el.offsetHeight, q.fy * H)) + 'px';
        el.style.transform = `rotate(${q.r}deg)`;
    });
}

const inside = (el, x, y) => { const r = el.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; };
function buildIndex(y, dragId) {
    const kids = [...$('build').querySelectorAll('.blk')].filter(k => k.dataset.id !== dragId);
    for (let i = 0; i < kids.length; i++) { const r = kids[i].getBoundingClientRect(); if (y < r.top + r.height / 2) return i; }
    return kids.length;
}

function startDrag(e, el, id, from) {
    e.preventDefault();
    const r = el.getBoundingClientRect(), offX = e.clientX - r.left, offY = e.clientY - r.top, w = r.width, h = r.height;
    const sx = e.clientX, sy = e.clientY; let moved = false;
    el.classList.add('dragging'); el.style.width = w + 'px'; el.style.left = r.left + 'px'; el.style.top = r.top + 'px'; el.style.transform = '';
    document.body.appendChild(el);
    const mv = ev => {
        if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 4) moved = true;
        el.style.left = (ev.clientX - offX) + 'px'; el.style.top = (ev.clientY - offY) + 'px';
        $('build').classList.toggle('over', inside($('build'), ev.clientX, ev.clientY));
    };
    const up = ev => {
        document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up);
        $('build').classList.remove('over'); el.remove();
        const overB = inside($('build'), ev.clientX, ev.clientY), overP = inside($('pool'), ev.clientX, ev.clientY);
        pool = pool.filter(x => x !== id); build = build.filter(x => x !== id);
        if (!moved) { (from === 'pool' ? build : pool).push(id); if (from === 'build') pos[id] = {fx: Math.random(), fy: Math.random() * .8, r: Math.random() * 6 - 3}; }
        else if (overB) build.splice(buildIndex(ev.clientY, id), 0, id);
        else if (overP) {
            const pr = $('pool').getBoundingClientRect();
            pos[id] = {fx: Math.max(0, Math.min(1, (ev.clientX - offX - pr.left) / Math.max(1, pr.width - w))), fy: Math.max(0, Math.min(1, (ev.clientY - offY - pr.top) / pr.height)), r: Math.random() * 6 - 3};
            pool.push(id);
        } else (from === 'pool' ? pool : build).push(id);
        render();
    };
    document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
}

$('check').onclick = () => {
    if (solved) return;
    const P = PROBS[pi], m = $('msg');
    if (!build.length) { m.textContent = '먼저 블록을 조립해 보세요!'; return; }
    tries++;
    if (eqCorrect(build, P)) {
        solved = true; render();
        const sec = (Date.now() - t0) / 1000;
        results.push({title: P.title, tries, sec, score: Math.max(20, 100 - 20 * (tries - 1))});
        m.textContent = ''; $('check').hidden = true; $('again').hidden = true; $('next').hidden = false;
        $('next').textContent = pi + 1 >= PROBS.length ? '결과 보기 ▶' : '다음 문제 ▶';
        $('stagetxt').textContent = P.cap; drawStage(true); celebrate();
        return;
    }
    const bad = eqBadIdx(build, P);
    render(bad);
    m.textContent = build.length < P.ids.length ? '블록이 더 필요해요!' : `아쉬워요! 맞는 자리 ${build.length - bad.length}개 / ${P.ids.length}개`;
};
$('again').onclick = () => { pool = shuffle(PROBS[pi].ids); build = []; $('msg').textContent = ''; PROBS[pi].ids.forEach((id, i) => pos[id] = {fx: Math.random(), fy: (i + Math.random() * .6) / PROBS[pi].ids.length, r: Math.random() * 6 - 3}); render(); };
$('next').onclick = () => { pi++; if (pi >= PROBS.length) showResult(); else loadProb(); };

// ---------- 결과 ----------
function showResult() {
    clearInterval(timer); stopStage(); show('sResult');
    const total = results.reduce((a, r) => a + r.score, 0), sec = Math.round((Date.now() - totalT0) / 1000);
    $('rbig').textContent = `${who.name} · ${LEVELS[lv].name} 결과`;
    $('rtable').innerHTML = '<tr><th>문제</th><th>시도</th><th>걸린 시간</th><th>점수</th></tr>' +
        results.map(r => `<tr><td>${r.title}</td><td>${r.tries}번</td><td>${Math.round(r.sec)}초</td><td>${r.score}점</td></tr>`).join('');
    $('rtotal').textContent = `총점 ${total}점 · 전체 ${sec}초`;
}
$('retry').onclick = () => { show('sEntry'); drawLevels(); };

// ---------- 정답 팝업 ----------
function celebrate() {
    const c = document.createElement('div'); c.className = 'celebrate';
    c.innerHTML = '<div class="flash"></div><div class="big">정답!!</div>';
    document.body.appendChild(c); setTimeout(() => c.remove(), 1800);
}
</script>
</body>
</html>
