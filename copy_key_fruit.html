<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상큼달콤 과일 복사하기 게임!</title>
    <style>
        /* ⚠️ 시스템 기본 글꼴 사용 */
        body, button, h1, h2, h3, p, div, span, a, b {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 30px 20px;
            user-select: none;
            overflow: hidden;
            height: 100vh;
            position: relative;
            box-sizing: border-box;
        }

        /* 🏠 왼쪽 상단 처음으로 버튼 */
        .home-btn {
            background-color: #222546;
            color: #ffde7d;
            border-color: #ffde7d;
            box-shadow: 0 4px 0 #16213e;
        }
        .home-btn:hover { background-color: #2a2e5c; }
        .home-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #16213e; }

        h1 { color: #ff6b6b; margin-top: 10px; margin-bottom: 5px; font-size: 44px; text-shadow: 2px 2px 0px #000, 4px 4px 10px rgba(255, 107, 107, 0.3); }
        .info { font-size: 24px; margin-bottom: 30px; color: #e0e0e0; font-weight: bold;}
        
        /* 📐 전체 레이아웃 */
        .game-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        .copy-zone {
            background: #16213e;
            border: 5px dashed #ff6b6b;
            border-radius: 40px;
            padding: 25px;
            width: 420px;
            height: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.3s;
        }
        
        /* 🛠️ 글씨 겹침 방지를 위해 줄간격(line-height) 및 여백 조정 */
        .copy-zone h3 {
            font-size: 26px;
            line-height: 1.6;
            margin: 0 0 10px 0;
            color: #ff6b6b;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .key-badge {
            background-color: #222;
            padding: 4px 12px;
            border-radius: 10px;
            border: 2px solid #fff;
            color: #ffde7d;
        }

        .item-source {
            font-size: 130px;
            cursor: pointer;
            padding: 10px;
            border-radius: 30px;
            transition: all 0.2s;
            outline: none;
            animation: floatItem 2.5s ease-in-out infinite;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .item-source.selected {
            background-color: rgba(255, 107, 107, 0.2);
            box-shadow: 0 0 40px #ff6b6b;
            animation: none;
            transform: scale(1.1);
        }

        #copy-hint {
            font-size: 26px;
            color: #BA9B8A;
            height: 70px;
            line-height: 70px;
            margin-top: 20px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 90%;
            border-radius: 20px;
            background: transparent;
        }

        #copy-hint.complete {
            background-color: #ff6b6b; 
            color: #FFF;
            font-size: 32px; 
            font-weight: bold;
            box-shadow: 0 12px 25px rgba(255, 107, 107, 0.5);
            animation: popBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border: 3px solid #FFF;
        }

        .paste-zone {
            position: relative;
            background: #0f3460;
            outline: 6px solid #4ecc71; 
            border-radius: 40px;
            width: 750px;
            height: 520px;
            overflow: hidden;
            cursor: crosshair;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.3s;
        }
        .paste-zone h3 {
            position: absolute;
            top: 25px;
            left: 0;
            right: 0;
            font-size: 32px;
            color: #4ecc71;
            margin: 0;
            z-index: 5;
            pointer-events: none;
        }
        .basket-bg {
            font-size: 260px;
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.15;
            pointer-events: none;
            animation: floatBag 3s ease-in-out infinite;
        }
        
        .target-marker {
            position: absolute;
            width: 45px;
            height: 45px;
            border: 3px dashed #ffde7d;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            pointer-events: none;
            box-sizing: border-box;
            z-index: 10;
        }
        .target-marker::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background: #ffde7d;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .pasted-item {
            position: absolute;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 65px;
            transform: translate(-50%, -50%);
            animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        #status-message {
            margin-top: 35px;
            font-size: 36px;
            color: #fff; 
            height: 55px;
            transition: all 0.1s;
            text-shadow: 1px 1px 2px #000;
        }

        /* 🛠️ "마우스로 클릭" 등 강조 텍스트가 커지지 않도록 고정 스타일로 변경 */
        .highlight-text {
            color: #ffde7d;
            font-size: 36px;
            font-weight: bold;
            display: inline-block;
            text-shadow: 0 0 10px rgba(255, 222, 125, 0.6);
        }

        #score-board {
            font-size: 36px;
            margin-top: 15px;
            color: #4ecc71;
            font-weight: bold;
        }

        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .success-content {
            background: #222546;
            border: 8px solid #ffde7d;
            border-radius: 40px;
            padding: 50px 70px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(255, 222, 125, 0.3);
            animation: bounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .success-content h2 {
            font-size: 70px;
            color: #ffde7d;
            margin: 0 0 15px 0;
        }
        .success-content p {
            font-size: 32px;
            color: #fff;
            margin-bottom: 35px;
            line-height: 1.5;
        }
        
        .btn-box { display: flex; gap: 20px; justify-content: center; margin-top: 20px; }
        .restart-btn, .home-popup-btn {
            width: 250px; height: 75px; font-size: 26px; font-weight: bold;
            border-radius: 20px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
            transition: all 0.1s;
        }
        .restart-btn {
            background: #4ecc71; color: white; box-shadow: 0 6px #27ae60;
        }
        .restart-btn:hover { background: #5edb81; }
        .restart-btn:active { transform: translateY(4px); box-shadow: 0 2px #27ae60; }

        .home-popup-btn {
            background: #ff6b6b; color: white; box-shadow: 0 6px #c0392b;
        }
        .home-popup-btn:hover { background: #ff8585; }
        .home-popup-btn:active { transform: translateY(4px); box-shadow: 0 2px #c0392b; }

        .disabled-zone {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(40%);
        }

        @keyframes pulseBorderLeft {
            0% { border-color: #ff6b6b; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
            50% { border-color: #ffde7d; box-shadow: 0 0 45px rgba(255, 222, 125, 0.9); }
            100% { border-color: #ff6b6b; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
        }
        .active-pulse-left {
            animation: pulseBorderLeft 1.2s infinite !important;
            border-color: #ffde7d !important;
        }

        @keyframes pulseBorderRight {
            0% { outline-color: #4ecc71; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
            50% { outline-color: #ffde7d; box-shadow: 0 0 50px rgba(255, 222, 125, 0.9); }
            100% { outline-color: #4ecc71; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
        }
        .active-pulse-right {
            animation: pulseBorderRight 1.2s infinite !important;
            outline: 6px solid #ffde7d !important;
        }

        @keyframes floatItem {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes floatBag {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            50% { transform: translate(-50%, -52%) scale(1.03) rotate(-2deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }
        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0); }
            70% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes popBounce {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); }
        }
        @keyframes bounce {
            0% { transform: scale(0.3); }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 🏠 왼쪽 상단 처음으로 버튼 -->
    <a href="copy_menu.html" class="home-btn">🏠 처음으로</a>

    <h1>🍎 상큼달콤 과일 복사하기 게임! 🍓</h1>
    <p class="info">과일을 똑같이 복사해서 바구니에 가득 담아주세요!</p>

    <div class="game-container">
        <div class="copy-zone active-pulse-left" id="zone-left">
            <h3><span>① 과일 클릭 후</span> <span class="key-badge">Ctrl + C</span></h3>
            <div id="item-box" class="item-source" tabindex="0">🍎</div>
            <div id="copy-hint">👆 먼저 눌러보세요!</div>
        </div>

        <div class="paste-zone disabled-zone" id="zone-right">
            <h3>② 여기서 바구니 클릭!</h3>
            <div class="basket-bg">🧺</div>
            <div id="target" class="target-marker"></div>
        </div>
    </div>

    <div id="status-message">👉 <b>①번 과일</b>을 <span class="highlight-text">마우스로 클릭!</span> 👈</div>
    <div id="score-board">🧺 바구니에 담은 과일: <span id="count" style="color:#ff6b6b; font-size:42px;">0</span> / 10 개</div>

    <div id="success-screen" class="success-overlay">
        <div class="success-content">
            <h2>🎉 미션 성공! 🎉</h2>
            <p style="font-size: 80px; margin: 15px 0;">🍎🍌🍇🍓🍊</p>
            <p>[복사]와 [붙여넣기]를 완벽하게 성공했어요!<br>정말 멋져요! 👍</p>
            <div class="btn-box">
                <button class="restart-btn" onclick="resetGame()">한 번 더 놀기 🔄</button>
                <a href="index.html" class="home-popup-btn">🏠 처음으로</a>
            </div>
        </div>
    </div>

    <script>
        const fruits = ['🍎', '🍌', '🍇', '🍓', '🍊', '🍑', '🍍', '🍉', '🥝', '🍒'];
        let currentFruit = '🍎';

        let isCopied = false;
        let isSelected = false;
        let targetX = 0;
        let targetY = 0;
        let itemCount = 0;
        let gameFinished = false;

        const itemBox = document.getElementById('item-box');
        const zoneLeft = document.getElementById('zone-left');
        const zoneRight = document.getElementById('zone-right');
        const basket = document.getElementById('zone-right');
        const target = document.getElementById('target');
        const msg = document.getElementById('status-message');
        const countTxt = document.getElementById('count');
        const copyHint = document.getElementById('copy-hint');
        const successScreen = document.getElementById('success-screen');

        function setRandomFruit() {
            const randomIndex = Math.floor(Math.random() * fruits.length);
            currentFruit = fruits[randomIndex];
            itemBox.innerText = currentFruit;
        }

        itemBox.addEventListener('click', () => {
            if(gameFinished) return;
            isSelected = true;
            itemBox.classList.add('selected');
            msg.innerHTML = "👉 이제 키보드에서 <span class='highlight-text'>[Ctrl + C]</span>를 누르세요!";
        });

        basket.addEventListener('click', (e) => {
            if(gameFinished) return;
            
            targetX = e.offsetX;
            targetY = e.offsetY;

            target.style.left = targetX + 'px';
            target.style.top = targetY + 'px';
            target.style.display = 'block';

            if (isCopied) {
                msg.innerHTML = "👉 이제 <span class='highlight-text'>[Ctrl + V]</span>를 누르면 과일이 뿅! 👈";
            } else {
                msg.textContent = "⚠️ 먼저 ①번 과일을 복사(Ctrl+C)해야 붙여넣을 수 있어요!";
            }
        });

        window.addEventListener('keydown', (e) => {
            if(gameFinished) return;
            
            const isCtrlPressed = e.ctrlKey || e.metaKey;
            const key = e.key.toLowerCase();

            if (isCtrlPressed && key === 'c') {
                if (isSelected) {
                    isCopied = true;
                    msg.innerHTML = "👉 ②번 바구니를 클릭하고 <span class='highlight-text'>[Ctrl + V]</span> 누르기! 👈";
                    
                    copyHint.innerText = "복사 완료! 👍";
                    copyHint.classList.add('complete');
                    
                    zoneLeft.classList.remove('active-pulse-left');
                    zoneRight.classList.remove('disabled-zone');
                    zoneRight.classList.add('active-pulse-right');
                    
                    e.preventDefault();
                }
            }

            if (isCtrlPressed && key === 'v') {
                if (isCopied) {
                    e.preventDefault();

                    const newItem = document.createElement('div');
                    newItem.className = 'pasted-item';
                    newItem.innerText = currentFruit;
                    newItem.style.left = targetX + 'px';
                    newItem.style.top = targetY + 'px';
                    basket.appendChild(newItem);

                    itemCount++;
                    countTxt.innerText = itemCount;

                    if (itemCount >= 10) {
                        gameFinished = true;
                        zoneRight.classList.remove('active-pulse-right');
                        setTimeout(() => {
                            successScreen.style.display = 'flex';
                        }, 200);
                    } else {
                        setRandomFruit();
                        isCopied = false;
                        isSelected = false;
                        itemBox.classList.remove('selected');
                        target.style.display = 'none';
                        
                        copyHint.innerText = "👆 다음 과일을 눌러보세요!";
                        copyHint.classList.remove('complete');
                        
                        zoneRight.classList.add('disabled-zone');
                        zoneRight.classList.remove('active-pulse-right');
                        zoneLeft.classList.add('active-pulse-left');

                        msg.innerHTML = "👉 <b>다음 과일</b>을 <span class='highlight-text'>마우스로 클릭!</span> (Ctrl+C ➔ V 반복!) 👈";
                    }
                } else {
                    msg.textContent = "⚠️ 복사를 먼저 해야 해요! 과일을 클릭하고 [Ctrl + C]!";
                }
            }
        });

        function resetGame() {
            isCopied = false;
            isSelected = false;
            itemCount = 0;
            gameFinished = false;
            
            countTxt.innerText = '0';
            successScreen.style.display = 'none';
            itemBox.classList.remove('selected');
            target.style.display = 'none';
            
            setRandomFruit();
            copyHint.innerText = "👆 먼저 눌러보세요!";
            copyHint.classList.remove('complete');
            
            zoneRight.classList.add('disabled-zone');
            zoneRight.classList.remove('active-pulse-right');
            zoneLeft.classList.add('active-pulse-left');
            
            msg.innerHTML = "👉 <b>①번 과일</b>을 <span class='highlight-text'>마우스로 클릭!</span> 👈";

            const pastedItems = document.querySelectorAll('.pasted-item');
            pastedItems.forEach(el => el.remove());
        }

        setRandomFruit();
    </script>
</body>
</html>
