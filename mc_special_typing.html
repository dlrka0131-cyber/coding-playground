<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마인크래프트 특수문자 타자 연습</title>
    <style>
        /* 화면에 딱 맞게 고정하고 스크롤이 생기지 않도록 설정 (위에서 아래로 흐르는 초록빛 그라데이션) */
        body { 
            background: linear-gradient(to bottom, #e8f5e9 0%, #c8e6c9 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            padding: 10px; 
            font-family: sans-serif; 
            position: relative; 
            height: 100vh; 
            overflow: hidden; 
            box-sizing: border-box; 
        }
        
        /* 처음으로 버튼 스타일 */
        .home-btn { 
            position: absolute; top: 20px; left: 20px; background-color: #FFF; 
            color: #55a03b; padding: 15px 35px; border-radius: 30px; 
            text-decoration: none; font-size: 24px; font-weight: bold; 
            box-shadow: 0 5px 0 #c8e6c9; border: 4px solid #55a03b; z-index: 999; 
        }

        /* 미션카드와 키보드의 너비를 동일하게(1100px) 맞추어 전체 비율을 깔끔하게 정돈 */
        .container { 
            background: white; 
            padding: 35px 45px; 
            border-radius: 30px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.12); 
            width: 1100px; 
            margin-bottom: 20px; 
            box-sizing: border-box;
            position: relative;
            text-align: center;
        }
        
        /* 우측 상단 진행 단계 표시 */
        #status-text { 
            position: absolute;
            top: 30px;
            right: 45px;
            font-size: 24px; 
            color: #7f8c8d; 
            font-weight: bold;
            margin: 0;
        }

        /* 상단 정보들을 감싸는 중앙 정렬 래퍼 (하얀 박스 안에서 완벽한 수평/수직 균형) */
        .header-info-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* 기호 이름 배지 */
        #char-name { 
            font-size: 42px; 
            color: #33691e; 
            font-weight: bold; 
            margin-bottom: 12px; 
            background-color: #dcedc8; 
            display: inline-block; 
            padding: 12px 35px; 
            border-radius: 25px; 
            box-shadow: 0 5px 15px rgba(85, 160, 59, 0.2);
        }

        /* 기호 설명 팁 */
        #desc-text {
            font-size: 22px;
            color: #6d4c41;
            font-weight: bold;
            background: #efebe9;
            padding: 10px 25px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        /* 제시어와 입력란을 가운데 정렬 수직 배치 */
        .target-input-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* 제시되는 특수문자 기호 스타일 */
        #target { 
            font-size: 75px; 
            font-weight: bold; 
            font-family: sans-serif;
            color: #000000; 
            line-height: 1;
        }
        
        /* 입력칸 스타일 */
        #input-field { 
            font-size: 45px; 
            font-weight: bold; 
            font-family: sans-serif;
            width: 150px; 
            padding: 12px; 
            border: 4px solid #c8e6c9; 
            border-radius: 20px; 
            color: #000000; 
            text-align: center; 
            outline: none;
        }
        
        /* 오타 시 글자색 및 테두리를 빨간색으로 변경 */
        .text-error { color: #e74c3c !important; border-color: #e74c3c !important; }
        
        /* 배경을 어둡게 만들어 팝업 집중도를 높이는 오버레이 배경 */
        #popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            z-index: 199;
        }

        /* 일반 칭찬 팝업 스타일 (통통 튀는 애니메이션 적용) */
        #popup { 
            display: none; 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) scale(0.9); 
            background: linear-gradient(135deg, #ffffff 0%, #fff0f6 100%); 
            color: #33691e; 
            padding: 60px 85px; 
            border-radius: 35px; 
            font-size: 44px; 
            font-weight: bold; 
            z-index: 200; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3); 
            border: 7px solid #c8e6c9;
            text-align: center; 
            line-height: 1.5; 
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* 마지막 완료 전용 팝업 스타일 */
        #finish-popup { 
            display: none; 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) scale(0.9); 
            background: linear-gradient(135deg, #ffffff 0%, #fff0f6 100%); 
            color: #33691e; 
            padding: 60px 85px; 
            border-radius: 35px; 
            font-size: 44px; 
            font-weight: bold; 
            z-index: 200; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3); 
            border: 7px solid #c8e6c9;
            text-align: center; 
            line-height: 1.5; 
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .finish-btns {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .finish-btn {
            background-color: #55a03b;
            color: white;
            padding: 15px 30px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 5px 0 #388e3c;
            border: none;
            cursor: pointer;
        }

        .finish-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #388e3c;
        }
        
        /* 키보드 판넬 너비를 미션카드와 동일한 1100px로 맞춰 통일감 부여 */
        #keyboard { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            background: #bcaaa4; 
            padding: 22px; 
            border-radius: 25px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
            width: 1100px;
            box-sizing: border-box;
        }
        .row { display: flex; gap: 8px; justify-content: center; }
        .key { 
            width: 62px; 
            height: 62px; 
            border-radius: 10px; 
            background: #efebe9; 
            border: 2px solid #d7ccc8; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 16px; 
            color: #4e342e; 
            box-shadow: 0 4px 0 #d7ccc8; 
        }
        .w-space { width: 440px; }
        .guide { background: #ffe082 !important; transform: scale(1.1); border-color: #ffa000; box-shadow: 0 0 12px #ffa000; color: #000 !important; }
    </style>
</head>
<body>

    <!-- 처음으로 버튼 -->
    <a href="mc_menu.html" class="home-btn">🏠 처음으로</a>

    <div class="container">
        <!-- 우측 상단 진행 단계 표시 -->
        <div id="status-text">특수문자 연습: 1 / 12</div>
        
        <!-- 상단 설명 정보들을 감싸는 중앙 정렬 래퍼 -->
        <div class="header-info-wrapper">
            <!-- 기호 이름 배지 -->
            <div id="char-name">느낌표 (!)</div>
            <!-- 기호 설명 팁 -->
            <div id="desc-text">💡 Shift 키를 누르고 숫자 1을 누르면 나와요!</div>
        </div>
        
        <!-- 제시어와 입력란 -->
        <div class="target-input-wrapper">
            <div id="target">!</div>
            <input type="text" id="input-field" maxlength="1" autocomplete="off" autofocus spellcheck="false">
        </div>
    </div>

    <!-- 팝업 배경 어두운 오버레이 -->
    <div id="popup-overlay"></div>

    <!-- 일반 단계 완료 팝업 -->
    <div id="popup">참 잘했어요! ✨</div>

    <!-- 마지막 단계 완료 팝업 (버튼 포함) -->
    <div id="finish-popup">
        참 잘했어요! ✨<br>
        <span style="font-size: 26px; color: #55a03b;">🏆 특수문자 마스터 완벽 성공!</span>
        <div class="finish-btns">
            <a href="mc_menu.html" class="finish-btn">🏠 처음으로</a>
            <button class="finish-btn" onclick="location.reload()">🔄 다시하기</button>
        </div>
    </div>

    <div id="keyboard">
        <div class="row" id="r1"></div>
        <div class="row" id="r2"></div>
        <div class="row" id="r3"></div>
        <div class="row" id="r4"></div>
        <div class="row"><div class="key w-space" id="key-Space">Space</div></div>
    </div>

    <script>
        const tasks = [
            { name: "느낌표", char: "!", desc: "💡 Shift 키를 누르고 숫자 1을 누르면 나와요!" },
            { name: "골뱅이", char: "@", desc: "💡 Shift 키를 누르고 숫자 2를 누르면 나와요!" },
            { name: "샵 (우물정)", char: "#", desc: "💡 Shift 키를 누르고 숫자 3을 누르면 나와요!" },
            { name: "달러", char: "$", desc: "💡 Shift 키를 누르고 숫자 4를 누르면 나와요!" },
            { name: "퍼센트", char: "%", desc: "💡 Shift 키를 누르고 숫자 5를 누르면 나와요!" },
            { name: "꺽쇠 (위로)", char: "^", desc: "💡 Shift 키를 누르고 숫자 6을 누르면 나와요!" },
            { name: "앰퍼샌드 (그리고)", char: "&", desc: "💡 Shift 키를 누르고 숫자 7을 누르면 나와요!" },
            { name: "별표", char: "*", desc: "💡 Shift 키를 누르고 숫자 8을 누르면 나와요!" },
            { name: "여는 괄호", char: "(", desc: "💡 Shift 키를 누르고 숫자 9를 누르면 나와요!" },
            { name: "닫는 괄호", char: ")", desc: "💡 Shift 키를 누르고 숫자 0을 누르면 나와요!" },
            { name: "언더바 (밑줄)", char: "_", desc: "💡 Shift 키를 누르고 빼기(-) 키를 누르면 나와요!" },
            { name: "더하기", char: "+", desc: "💡 Shift 키를 누르고 등호(=) 키를 누르면 나와요!" }
        ];
        
        const specialKeys = { '!': '1', '@': '2', '#': '3', '$': '4', '%': '5', '^': '6', '&': '7', '*': '8', '(': '9', ')': '0', '_': '-', '+': '=' };

        let taskIndex = 0;
        const input = document.getElementById('input-field');
        const statusText = document.getElementById('status-text');
        const charName = document.getElementById('char-name');
        const targetDiv = document.getElementById('target');
        const descDiv = document.getElementById('desc-text');
        const popup = document.getElementById('popup');
        const popupOverlay = document.getElementById('popup-overlay');
        const finishPopup = document.getElementById('finish-popup');
        
        const layout = [
            ['~', '1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '=', 'Backspace'],
            ['Tab', 'Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P', '[', ']', '\\'],
            ['Caps', 'A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', ';', "'", 'Enter'],
            ['Shift', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', ',', '.', '/', 'Shift']
        ];

        const kb = document.getElementById('keyboard');
        layout.forEach((row, i) => {
            const rowDiv = document.getElementById('r' + (i + 1));
            row.forEach(k => {
                const div = document.createElement('div');
                div.className = 'key';
                div.innerText = k;
                div.id = 'key-' + k;
                rowDiv.appendChild(div);
            });
        });

        function updateGuide() {
            document.querySelectorAll('.key').forEach(k => k.classList.remove('guide'));
            let char = tasks[taskIndex].char;
            
            document.getElementById('key-Shift').classList.add('guide');
            const targetKey = specialKeys[char];
            const keyEl = document.getElementById('key-' + targetKey);
            if (keyEl) keyEl.classList.add('guide');
        }

        input.addEventListener('input', (e) => {
            let currentTarget = tasks[taskIndex].char;
            let val = input.value;

            if (val.length > 0) {
                if (val === currentTarget) {
                    input.classList.remove('text-error');
                    input.disabled = true;

                    if (taskIndex === tasks.length - 1) {
                        popupOverlay.style.display = 'block';
                        finishPopup.style.display = 'block';
                    } else {
                        let nextTask = tasks[taskIndex + 1];
                        popup.innerHTML = `참 잘했어요! ✨<br><span style="font-size: 26px; color: #55a03b;">다음은 '${nextTask.name}(${nextTask.char})'를 연습해볼까요?</span>`;

                        popupOverlay.style.display = 'block';
                        popup.style.display = 'block';
                        
                        setTimeout(() => {
                            popup.style.display = 'none';
                            popupOverlay.style.display = 'none';
                            input.disabled = false; 
                            input.value = ""; 
                            taskIndex++;
                            
                            statusText.innerText = `특수문자 연습: ${taskIndex + 1} / ${tasks.length}`;
                            charName.innerText = `${tasks[taskIndex].name} (${tasks[taskIndex].char})`;
                            targetDiv.innerText = tasks[taskIndex].char;
                            descDiv.innerText = tasks[taskIndex].desc;
                            
                            input.focus(); 
                            updateGuide();
                        }, 2500);
                    }
                } else {
                    input.classList.add('text-error');
                    setTimeout(() => {
                        input.value = "";
                        input.classList.remove('text-error');
                    }, 400);
                }
            }
        });

        updateGuide();
    </script>
</body>
</html>
