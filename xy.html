<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="common.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⭐ 반짝반짝 별 찾기 ⭐</title>
    <style>
        /* 온라인 웹 폰트 연결 */
body {
            font-family: 'ONEMobilePOP', sans-serif;
            background-color: #192a56; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            overflow: hidden; 
        }

        #main-wrapper {
            display: flex;
            gap: 25px;
            align-items: stretch; 
        }

        #sidebar {
            background-color: #ffffff;
            border: 6px solid #686de0; 
            border-radius: 40px; 
            padding: 30px;
            box-shadow: none; 
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 { 
            color: #ff4757; 
            font-size: 46px; 
            margin-bottom: 30px; 
            margin-top: 0;
            line-height: 1.2;
            text-shadow: none; 
        }

        .info-box {
            background-color: #f4f6f9;
            width: 100%;
            padding: 15px 0;
            border-radius: 20px;
            border: 3px dashed #a4b0be;
            margin-bottom: 20px;
            font-size: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .info-box .label {
            font-size: 22px;
            color: #747d8c;
        }

        #mission-display { font-size: 38px; font-weight: bold; }
        #score-display { color: #f0932b; font-weight: bold; font-size: 42px;}
        #time-display { color: #eb4d4b; font-weight: bold; font-size: 42px;}

        .sidebar-btn-group {
            margin-top: auto; 
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        #game-container {
            background-color: #ffffff;
            border: 6px solid #686de0; 
            border-radius: 40px; 
            padding: 20px;
            box-shadow: none; 
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ⭐️ 1100x700 크기로 확장된 게임 영역 및 정중앙 그리드 정렬 */
        #game-area {
            background-color: #fdfbf7;
            border: 4px solid #30336b; 
            border-radius: 25px;
            width: 1100px;
            height: 700px;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
            
            background-image: 
                linear-gradient(to right, rgba(52, 73, 94, 0.25) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(52, 73, 94, 0.25) 1px, transparent 1px),
                linear-gradient(to right, rgba(189, 195, 199, 0.4) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(189, 195, 199, 0.4) 1px, transparent 1px);
            background-size: 
                125px 125px, 125px 125px, 
                25px 25px, 25px 25px;
            background-position: 
                550px 350px, 550px 350px, 
                550px 350px, 550px 350px;
        }

        /* ⭐️ 두껍고 선명한 십자선 (정중앙 550px, 350px 위치) */
        .axis { position: absolute; z-index: 5; pointer-events: none; }
        .axis-x { 
            background-color: #ff3838; 
            width: 100%; height: 4px; 
            top: 350px; left: 0; 
            transform: translateY(-50%); 
            box-shadow: 0 0 4px rgba(255, 56, 56, 0.5); 
        }
        .axis-y { 
            background-color: #0984e3; 
            width: 4px; height: 100%; 
            left: 550px; top: 0; 
            transform: translateX(-50%); 
            box-shadow: 0 0 4px rgba(9, 132, 227, 0.5); 
        }

        .axis-label {
            position: absolute;
            font-size: 18px;
            color: #2c3e50;
            pointer-events: none;
            z-index: 6;
            background: rgba(253, 251, 247, 0.9);
            padding: 2px 6px;
            border-radius: 6px;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
        }

        /* ⭐️ 연습 모드 안내선 (목표 좌표까지 반투명 점선) */
        .guide-line { position: absolute; pointer-events: none; z-index: 4; }
        .guide-line-x { top: 0; height: 100%; border-left: 6px dashed rgba(255, 56, 56, 0.35); transform: translateX(-50%); }
        .guide-line-y { left: 0; width: 100%; border-top: 6px dashed rgba(9, 132, 227, 0.35); transform: translateY(-50%); }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.92);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; border-radius: 20px;
        }
        #result-overlay { display: none; }
        #howto-overlay { display: none; }

        .overlay h2 { font-size: 60px; color: #686de0; margin-bottom: 20px; text-shadow: none; }
        .overlay p { font-size: 34px; color: #34495e; margin-bottom: 40px; }

        /* ⭐️ 연습 모드 진입 시 좌표 읽는 법 안내 */
        #howto-overlay p { font-size: 26px; margin-bottom: 20px; }
        .howto-back {
            position: absolute; top: 20px; left: 20px; background: none; border: none;
            font-family: 'ONEMobilePOP', sans-serif; font-size: 20px; color: #a4b0be; cursor: pointer;
        }
        .howto-diagram {
            position: relative; width: 300px; height: 200px; margin-bottom: 25px;
            background-color: #fdfbf7; border: 3px solid #30336b; border-radius: 16px;
        }
        .howto-axis { position: absolute; }
        .howto-axis-x { left: 0; top: 145px; width: 100%; height: 3px; background-color: #ff3838; }
        .howto-axis-y { left: 55px; top: 0; width: 3px; height: 100%; background-color: #0984e3; }
        .howto-guide { position: absolute; }
        .howto-guide-v { left: 195px; top: 60px; width: 0; height: 85px; border-left: 4px dashed rgba(255, 56, 56, 0.6); }
        .howto-guide-h { left: 55px; top: 60px; width: 140px; height: 0; border-top: 4px dashed rgba(9, 132, 227, 0.6); }
        .howto-star { position: absolute; left: 195px; top: 60px; transform: translate(-50%, -50%); font-size: 26px; }
        .howto-label { position: absolute; font-size: 26px; font-weight: bold; font-family: 'Arial', sans-serif; }
        .howto-label-x { left: 195px; top: 150px; transform: translateX(-50%); color: #ff4757; }
        .howto-label-y { left: 8px; top: 60px; transform: translateY(-50%); color: #1e90ff; }
        
        /* 칭찬 메시지 스타일 */
        #feedback-msg { font-size: 30px; color: #1e90ff; margin-top: 20px; margin-bottom: 40px; font-weight: bold; text-align: center; line-height: 1.4; }
        
        .big-action-button {
            background-color: #686de0; color: white; border: none; border-radius: 30px;
            padding: 15px 30px; font-size: 32px; font-family: 'ONEMobilePOP', sans-serif;
            cursor: pointer; transition: all 0.1s; 
            box-shadow: none; 
            width: 100%;
        }
        .big-action-button:active { transform: scale(0.97); }

        .home-accent {
            background-color: #f9ca24;
            color: #2c3e50;
            font-size: 26px;
            padding: 12px 20px;
        }

        .click-marker {
            position: absolute; width: 16px; height: 16px;
            background-color: #e74c3c; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
            box-shadow: 0 0 12px rgba(231, 76, 60, 0.9); z-index: 10;
            animation: popOut 1s forwards;
        }

        .click-tooltip {
            position: absolute; background-color: #30336b; color: white;
            padding: 6px 12px; border-radius: 10px; font-size: 22px; font-family: 'ONEMobilePOP', sans-serif;
            pointer-events: none; transform: translate(-50%, -150%); z-index: 11;
            animation: popOut 1.5s forwards; white-space: nowrap;
        }

        .star-anim {
            position: absolute; font-size: 70px; z-index: 9;
            transform: translate(-50%, -50%); pointer-events: none;
            animation: bounce 0.5s ease-out;
        }

        @keyframes popOut { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes bounce { 0% { transform: translate(-50%, -50%) scale(0); } 50% { transform: translate(-50%, -50%) scale(1.5); } 100% { transform: translate(-50%, -50%) scale(1); } }
    </style>
</head>
<body>

    <div id="main-wrapper">
        <div id="sidebar">
            <h1>⭐ 반짝반짝<br>별 찾기</h1>
            
            <div class="info-box">
                <span class="label">🎯 목표 좌표</span>
                <span id="mission-display">준비...</span>
            </div>
            
            <div class="info-box">
                <span class="label">⭐ 찾은 별 갯수</span>
                <div><span id="score-display">0</span>개</div>
            </div>
            
            <div class="info-box">
                <span class="label">⏰ 남은 시간</span>
                <span id="time-display">60초</span>
            </div>

            <div class="sidebar-btn-group">
                <button id="end-practice-btn" class="big-action-button" onclick="endGame()" style="display: none; background-color: #1e90ff;">✅ 연습 끝내기</button>
                <!-- 선택 메뉴 페이지로 돌아가도록 링크 수정 -->
                <button class="big-action-button home-accent" onclick="location.href='xy_menu.html'">🏠 처음으로 </button>
            </div>
        </div>

        <div id="game-container">
            <div id="game-area">
                <div class="axis axis-x"></div>
                <div class="axis axis-y"></div>
                
                <div id="start-overlay" class="overlay">
                    <h2>⭐ 3단계: XY좌표 별 찾기!</h2>
                    <p>원하는 모드를 골라 시작하세요!</p>
                    <div style="display: flex; gap: 20px;">
                        <button class="big-action-button" onclick="showHowTo()" style="width: auto; padding: 20px 40px; font-size: 28px; background-color: #1e90ff; line-height: 1.6;">🔰 연습 모드<br><span style="font-size: 16px; font-weight: normal;">안내선 O · 시간제한 X</span></button>
                        <button class="big-action-button" onclick="startGame('challenge')" style="width: auto; padding: 20px 40px; font-size: 28px; line-height: 1.6;">🔥 도전 모드<br><span style="font-size: 16px; font-weight: normal;">안내선 X · 60초</span></button>
                    </div>
                </div>

                <div id="howto-overlay" class="overlay">
                    <button class="howto-back" onclick="showStartOverlay()">‹ 뒤로</button>
                    <h2 style="font-size: 42px;">🔎 좌표 읽는 법</h2>
                    <div class="howto-diagram">
                        <div class="howto-axis howto-axis-x"></div>
                        <div class="howto-axis howto-axis-y"></div>
                        <div class="howto-guide howto-guide-v"></div>
                        <div class="howto-guide howto-guide-h"></div>
                        <div class="howto-star">🌟</div>
                        <div class="howto-label howto-label-x">100</div>
                        <div class="howto-label howto-label-y">50</div>
                    </div>
                    <p>목표 좌표 (<span style="color:#ff4757; font-weight:bold;">100</span>, <span style="color:#1e90ff; font-weight:bold;">50</span>)이라면<br>
                    빨간 점선을 따라 <span style="color:#ff4757; font-weight:bold;">X=100</span> 자리를 찾고<br>
                    파란 점선을 따라 <span style="color:#1e90ff; font-weight:bold;">Y=50</span> 자리를 찾아서<br>
                    두 선이 만나는 곳을 클릭해요! ⭐</p>
                    <button class="big-action-button" onclick="startGame('practice')" style="width: auto; padding: 18px 50px; font-size: 30px;">이해했어요! 시작하기 🚀</button>
                </div>

                <div id="result-overlay" class="overlay">
                    <h2>탐험 종료!</h2>
                    <p style="margin-bottom: 20px;">내가 찾은 별: <span id="final-score" style="color:#e74c3c; font-weight:bold;">0</span> 개!</p>
                    <p id="feedback-msg"></p>
                    <button class="big-action-button" onclick="showStartOverlay()" style="width: auto; padding: 20px 60px; font-size: 40px;">다시 탐험하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const missionDisplay = document.getElementById('mission-display');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const startOverlay = document.getElementById('start-overlay');
        const howtoOverlay = document.getElementById('howto-overlay');
        const resultOverlay = document.getElementById('result-overlay');
        const feedbackMsg = document.getElementById('feedback-msg');
        const endPracticeBtn = document.getElementById('end-practice-btn');

        /* ⭐️ 1100x700 크기에 맞춘 정중앙 좌표 설정 */
        const CENTER_X = 550;
        const CENTER_Y = 350;
        const SCALE = 2.5; 

        function drawAxisLabels() {
            for (let x = -200; x <= 200; x += 50) {
                let label = document.createElement('div');
                label.className = 'axis-label';
                label.textContent = x === 0 ? '(0,0)' : x;
                label.style.color = '#ff4757'; 
                
                label.style.left = (x * SCALE + CENTER_X) + 'px';
                label.style.top = (CENTER_Y + 8) + 'px'; 
                
                label.style.transform = x === 0 ? 'translate(8px, 8px)' : 'translateX(-50%)'; 
                gameArea.appendChild(label);
            }

            for (let y = -100; y <= 100; y += 50) {
                if (y !== 0) {
                    let label = document.createElement('div');
                    label.className = 'axis-label';
                    label.textContent = y;
                    label.style.color = '#1e90ff'; 
                    
                    label.style.left = (CENTER_X + 8) + 'px';
                    label.style.top = (-y * SCALE + CENTER_Y) + 'px';
                    label.style.transform = 'translateY(-50%)';
                    gameArea.appendChild(label);
                }
            }
        }
        drawAxisLabels();

        let score = 0;
        let timeLeft = 60;
        let gameInterval;
        let targetX = 0;
        let targetY = 0;
        let isPracticeMode = false;

        const xOptions = [-200, -150, -100, -50, 0, 50, 100, 150, 200];
        const yOptions = [-100, -50, 0, 50, 100];

        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                const now = audioCtx.currentTime;
                if(type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1046.50, now); 
                    osc.frequency.setValueAtTime(1318.51, now + 0.1); 
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now); osc.stop(now + 0.5);
                } else if(type === 'miss') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                }
            } catch(e) {}
        }

        function showHowTo() {
            startOverlay.style.display = 'none';
            howtoOverlay.style.display = 'flex';
        }

        function startGame(mode) {
            isPracticeMode = mode === 'practice';
            score = 0;
            timeLeft = 60;
            scoreDisplay.textContent = score;

            startOverlay.style.display = 'none';
            howtoOverlay.style.display = 'none';
            resultOverlay.style.display = 'none';

            document.querySelectorAll('.click-marker, .click-tooltip, .star-anim, .guide-line').forEach(el => el.remove());

            clearInterval(gameInterval);
            if (isPracticeMode) {
                timeDisplay.textContent = '연습 중';
                endPracticeBtn.style.display = 'block';
            } else {
                timeDisplay.textContent = timeLeft + '초';
                endPracticeBtn.style.display = 'none';
                gameInterval = setInterval(updateTime, 1000);
            }

            setNewTarget();
        }

        function showStartOverlay() {
            clearInterval(gameInterval);
            endPracticeBtn.style.display = 'none';
            document.querySelectorAll('.click-marker, .click-tooltip, .star-anim, .guide-line').forEach(el => el.remove());
            howtoOverlay.style.display = 'none';
            resultOverlay.style.display = 'none';
            startOverlay.style.display = 'flex';
        }

        function updateTime() {
            timeLeft--;
            timeDisplay.textContent = timeLeft + '초';
            if (timeLeft <= 0) endGame();
        }

        function setNewTarget() {
            document.querySelectorAll('.guide-line').forEach(el => el.remove());

            targetX = xOptions[Math.floor(Math.random() * xOptions.length)];
            targetY = yOptions[Math.floor(Math.random() * yOptions.length)];

            missionDisplay.innerHTML = `(<span style="color:#ff4757;">${targetX}</span>, <span style="color:#1e90ff;">${targetY}</span>)`;

            if (isPracticeMode) drawGuideLines(targetX, targetY);
        }

        function drawGuideLines(x, y) {
            const vLine = document.createElement('div');
            vLine.className = 'guide-line guide-line-x';
            vLine.style.left = (x * SCALE + CENTER_X) + 'px';
            gameArea.appendChild(vLine);

            const hLine = document.createElement('div');
            hLine.className = 'guide-line guide-line-y';
            hLine.style.top = (-y * SCALE + CENTER_Y) + 'px';
            gameArea.appendChild(hLine);
        }

        gameArea.addEventListener('click', function(e) {
            // ⭐️ 시작/결과 오버레이 버튼 클릭 시 오작동 방지
            if (e.target.closest('#start-overlay') || e.target.closest('#result-overlay')) return;

            if (timeLeft <= 0 || startOverlay.style.display !== 'none') return;

            const rect = gameArea.getBoundingClientRect();
            const clickX_px = e.clientX - rect.left; 
            const clickY_px = e.clientY - rect.top;

            let mathX = (clickX_px - CENTER_X) / SCALE;
            let mathY = -(clickY_px - CENTER_Y) / SCALE;

            mathX = Math.round(mathX / 10) * 10;
            mathY = Math.round(mathY / 10) * 10;

            if(mathX < -220 || mathX > 220 || mathY < -120 || mathY > 120) return;

            if (mathX === targetX && mathY === targetY) {
                playSound('success');
                score++;
                scoreDisplay.textContent = score;

                const star = document.createElement('div');
                star.className = 'star-anim';
                star.textContent = '🌟'; 
                
                star.style.left = (targetX * SCALE + CENTER_X) + 'px';
                star.style.top = (-targetY * SCALE + CENTER_Y) + 'px';
                gameArea.appendChild(star);

                setTimeout(() => {
                    star.remove();
                    setNewTarget();
                }, 800);
                
            } else {
                playSound('miss');
                
                const marker = document.createElement('div');
                marker.className = 'click-marker';
                marker.style.left = (mathX * SCALE + CENTER_X) + 'px';
                marker.style.top = (-mathY * SCALE + CENTER_Y) + 'px';
                
                const tooltip = document.createElement('div');
                tooltip.className = 'click-tooltip';
                tooltip.textContent = `여긴 (${mathX}, ${mathY})`;
                tooltip.style.left = (mathX * SCALE + CENTER_X) + 'px';
                tooltip.style.top = (-mathY * SCALE + CENTER_Y) + 'px';

                gameArea.appendChild(marker);
                gameArea.appendChild(tooltip);

                setTimeout(() => { marker.remove(); tooltip.remove(); }, 1500);
            }
        });

        function endGame() {
            clearInterval(gameInterval);
            document.getElementById('final-score').textContent = score;
            endPracticeBtn.style.display = 'none';
            document.querySelectorAll('.guide-line').forEach(el => el.remove());

            if (isPracticeMode) {
                feedbackMsg.innerHTML = "연습 잘했어요!<br>이제 도전 모드에서 실력을 확인해볼까요? 🔥";
                feedbackMsg.style.color = "#1e90ff";
            } else if (score >= 15) {
                feedbackMsg.innerHTML = "와우! 완벽한 좌표 마스터네요!<br>(X, Y) 위치 찾기는 이제 문제없어요! 🚀";
                feedbackMsg.style.color = "#ff4757";
            } else if (score >= 10) {
                feedbackMsg.innerHTML = "참 잘했어요!<br>목표 좌표를 아주 정확하게 짚어냈어요! 👏";
                feedbackMsg.style.color = "#f0932b";
            } else if (score >= 5) {
                feedbackMsg.innerHTML = "좋아요!<br>X축과 Y축이 만나는 점을 찾는 연습을<br>조금만 더 해볼까요? 😉";
                feedbackMsg.style.color = "#1e90ff";
            } else {
                feedbackMsg.innerHTML = "아쉬워요!<br>(X, Y) 좌표를 보고 정확한 위치를 찾는<br>연습을 해봐요! 💪";
                feedbackMsg.style.color = "#747d8c";
            }

            resultOverlay.style.display = 'flex';
        }
    </script>
</body>
</html>
