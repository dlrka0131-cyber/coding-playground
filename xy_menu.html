<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="common.css">
    <meta charset="UTF-8">
    <title>⭐ 좌표 연습 놀이터 ⭐</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/Pretendard-Regular.woff');

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #4e4376;
            margin: 0; padding: 110px 0 60px 0; min-height: 100vh; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            position: relative;
        }

        /* 왼쪽 상단 '처음으로' 버튼 스타일 */
        .home-btn {
            background-color: #f9ca24;
            color: #2c3e50;
            border-color: #ffffff;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .home-btn:hover {
            transform: translateY(-3px);
            background-color: #f6b93b;
        }
        .home-btn:active {
            transform: translateY(2px);
        }

        header { text-align: center; margin-bottom: 50px; }
        h1 { font-size: 80px; color: #f9ca24; font-family: 'ONEMobilePOP', sans-serif; margin: 0 0 25px 0; text-shadow: 3px 3px 0px #4834d4; }
        .sub-desc { font-size: 26px; background: white; padding: 15px 30px; border-radius: 40px; color: #4e4376; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-family: 'ONEMobilePOP', sans-serif; }

        .container { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; max-width: 1400px; }

        .card {
            width: 250px; height: 310px; background: white; border-radius: 55px;
            box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(104, 109, 224, 0.25); transition: 0.3s;
            text-decoration: none;
            border: 3px solid #686de0;
        }

        .card:hover {
            transform: translateY(-8px);
            background-color: #fdfbf7;
            box-shadow: 0 20px 40px rgba(104, 109, 224, 0.4);
            border-color: #ff4757;
        }

        .tag { font-size: 20px; font-weight: 800; padding: 8px 20px; border-radius: 20px; margin-bottom: 15px; background-color: #ece7fd; color: #4e4376; }

        .icon { font-size: 90px; margin-bottom: 20px; }
        .title { font-size: 28px; font-family: 'ONEMobilePOP', sans-serif; color: #2c3e50; text-align: center; }
    </style>
</head>
<body>

    <!-- 왼쪽 상단 메인 이동 버튼 -->
    <a href="index.html" class="home-btn">
        <span>🏠</span> 처음으로
    </a>

    <header>
        <h1>⭐ 우주 좌표 탐험대 ⭐</h1>
        <div class="sub-desc">어떤 좌표 마법을 연습해 볼까요? 원하는 놀이를 골라보세요!</div>
    </header>

    <div class="container">
        <!-- 1단계: X좌표만 (x.html) -->
        <a href="xy_x.html" class="card">
            <div class="tag">1단계</div>
            <div class="icon">👽</div>
            <div class="title">X좌표</div>
        </a>

        <!-- 2단계: Y좌표만 (y.html) -->
        <a href="xy_y.html" class="card">
            <div class="tag">2단계</div>
            <div class="icon">🚀</div>
            <div class="title">Y좌표</div>
        </a>

        <!-- 3단계: XY좌표 완성 (xy.html) -->
        <a href="xy.html" class="card">
            <div class="tag">3단계</div>
            <div class="icon">🌟</div>
            <div class="title">XY좌표</div>
        </a>

        <!-- 4단계: 삐약이 좌표여행 (xy_write.html) -->
        <a href="xy_write.html" class="card">
            <div class="tag">4단계</div>
            <div class="icon">🐥</div>
            <div class="title">삐약이 좌표여행</div>
        </a>
    </div>

    <!-- 하단 제작자 정보 -->
    <footer class="footer" style="color: #a4b0be;">
        제작: 김정이 선생님 ❤️ | © 2026 Coding Playground
    </footer>
</body>
</html>
