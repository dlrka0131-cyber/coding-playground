<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="common.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👽 X좌표 외계인 찾기 👽</title>
    <style>
body {
            font-family: 'ONEMobilePOP', sans-serif;
            background-color: #192a56; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            overflow: hidden; 
        }

        #main-wrapper {
            display: flex;
            gap: 25px;
            align-items: stretch; 
        }

        #sidebar {
            background-color: #ffffff;
            border: 6px solid #686de0; 
            border-radius: 40px; 
            padding: 30px;
            box-shadow: none; 
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 { 
            color: #ff4757; 
            font-size: 44px; 
            margin-bottom: 30px; 
            margin-top: 0;
            line-height: 1.2;
            text-shadow: none; 
        }

        .info-box {
            background-color: #f4f6f9;
            width: 100%;
            padding: 15px 0;
            border-radius: 20px;
            border: 3px dashed #a4b0be;
            margin-bottom: 20px;
            font-size: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .info-box .label {
            font-size: 22px;
            color: #747d8c;
        }

        #mission-display { font-size: 38px; font-weight: bold; }
        
        #score-display { color: #2ed573; font-weight: bold; font-size: 42px;}
        
        #time-display { color: #eb4d4b; font-weight: bold; font-size: 42px;}

        .sidebar-btn-group {
            margin-top: auto; 
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        #game-container {
            background-color: #ffffff;
            border: 6px solid #686de0; 
            border-radius: 40px; 
            padding: 20px;
            box-shadow: none; 
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-area {
            background-color: #fdfbf7;
            border: 4px solid #30336b; 
            border-radius: 25px;
            width: 1100px;
            height: 700px;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
            
            background-image: 
                linear-gradient(to right, rgba(52, 73, 94, 0.25) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(52, 73, 94, 0.25) 1px, transparent 1px),
                linear-gradient(to right, rgba(189, 195, 199, 0.4) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(189, 195, 199, 0.4) 1px, transparent 1px);
            background-size: 
                125px 125px, 125px 125px, 
                25px 25px, 25px 25px;
            background-position: 
                550px 350px, 550px 350px, 
                550px 350px, 550px 350px;
        }

        .axis { position: absolute; z-index: 5; pointer-events: none; }
        .axis-x { 
            background-color: #ff3838; 
            width: 100%; height: 4px; 
            top: 350px; left: 0; 
            transform: translateY(-50%); 
            box-shadow: 0 0 4px rgba(255, 56, 56, 0.5); 
        }
        .axis-y { 
            background-color: #0984e3; 
            width: 4px; height: 100%; 
            left: 550px; top: 0; 
            transform: translateX(-50%); 
            box-shadow: 0 0 4px rgba(9, 132, 227, 0.5); 
        }

        .axis-label {
            position: absolute;
            font-size: 18px; 
            color: #2c3e50;
            pointer-events: none;
            z-index: 6;
            background: rgba(253, 251, 247, 0.9);
            padding: 2px 6px;
            border-radius: 6px;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.92);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; border-radius: 20px;
        }
        #result-overlay { display: none; }
        
        .overlay h2 { font-size: 60px; color: #ff4757; margin-bottom: 20px; text-shadow: none; }
        .overlay p { font-size: 34px; color: #34495e; margin-bottom: 40px; }
        
        #feedback-msg { font-size: 30px; color: #1e90ff; margin-top: 20px; margin-bottom: 40px; font-weight: bold; text-align: center; line-height: 1.4; }
        
        .big-action-button {
            background-color: #686de0; color: white; border: none; border-radius: 30px;
            padding: 15px 30px; font-size: 32px; font-family: 'ONEMobilePOP', sans-serif;
            cursor: pointer; transition: all 0.1s; 
            box-shadow: none; 
            width: 100%;
        }
        .big-action-button:active { transform: scale(0.97); }

        .home-accent {
            background-color: #f9ca24;
            color: #2c3e50;
            font-size: 26px;
            padding: 12px 20px;
        }

        .click-marker {
            position: absolute; width: 16px; height: 16px;
            background-color: #ff4757; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
            z-index: 10;
            animation: popOut 1s forwards;
        }

        .click-tooltip {
            position: absolute; background-color: #30336b; color: white;
            padding: 6px 12px; border-radius: 10px; font-size: 22px; font-family: 'ONEMobilePOP', sans-serif;
            pointer-events: none; transform: translate(-50%, -150%); z-index: 11;
            animation: popOut 1.5s forwards; white-space: nowrap;
        }

        .alien-anim {
            position: absolute; font-size: 70px; z-index: 9;
            transform: translate(-50%, -50%); pointer-events: none;
            animation: bounce 0.5s ease-out;
        }

        @keyframes popOut { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes bounce { 0% { transform: translate(-50%, -50%) scale(0); } 50% { transform: translate(-50%, -50%) scale(1.5); } 100% { transform: translate(-50%, -50%) scale(1); } }
    </style>
</head>
<body>

    <div id="main-wrapper">
        <div id="sidebar">
            <h1 style="color: #ff4757;">👽 X좌표<br>외계인 찾기</h1>
            
            <div class="info-box">
                <span class="label">🎯 목표 X좌표</span>
                <span id="mission-display">준비...</span>
            </div>
            
            <div class="info-box">
                <span class="label">👽 만난 외계인</span>
                <div><span id="score-display">0</span>명</div>
            </div>
            
            <div class="info-box">
                <span class="label">⏰ 남은 시간</span>
                <span id="time-display">60초</span>
            </div>

            <div class="sidebar-btn-group">
                <button class="big-action-button home-accent" onclick="location.href='xy_menu.html'">🏠 처음으로</button>
            </div>
        </div>

        <div id="game-container">
            <div id="game-area">
                <div class="axis axis-x"></div>
                <div class="axis axis-y"></div>
                
                <div id="start-overlay" class="overlay">
                    <h2>🚀 1단계: X좌표 외계인 찾기!</h2>
                    <p>정확한 X좌표를 클릭해 귀여운 외계인을 만나보세요!</p>
                    <button class="big-action-button" onclick="startGame()" style="width: auto; padding: 20px 60px; font-size: 40px; background-color: #ff4757;">▶ 탐험 시작!</button>
                </div>

                <div id="result-overlay" class="overlay">
                    <h2>탐험 종료!</h2>
                    <p style="margin-bottom: 20px;">만난 외계인: <span id="final-score" style="color:#ff4757; font-weight:bold;">0</span> 명!</p>
                    <p id="feedback-msg"></p>
                    <button class="big-action-button" onclick="startGame()" style="width: auto; padding: 20px 60px; font-size: 40px; background-color: #ff4757;">다시 탐험하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const missionDisplay = document.getElementById('mission-display');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const startOverlay = document.getElementById('start-overlay');
        const resultOverlay = document.getElementById('result-overlay');
        const feedbackMsg = document.getElementById('feedback-msg'); 

        const CENTER_X = 550;
        const CENTER_Y = 350;
        const SCALE = 2.5; 

        function drawAxisLabels() {
            for (let x = -200; x <= 200; x += 50) {
                let label = document.createElement('div');
                label.className = 'axis-label';
                label.textContent = x === 0 ? '0' : x;
                label.style.color = '#ff4757'; 
                
                label.style.left = (x * SCALE + CENTER_X) + 'px';
                label.style.top = (CENTER_Y + 8) + 'px'; 
                label.style.transform = 'translateX(-50%)'; 
                gameArea.appendChild(label);
            }

            for (let y = -100; y <= 100; y += 50) {
                if (y !== 0) {
                    let label = document.createElement('div');
                    label.className = 'axis-label';
                    label.textContent = y;
                    label.style.color = '#1e90ff'; 
                    
                    label.style.left = (CENTER_X + 8) + 'px';
                    label.style.top = (-y * SCALE + CENTER_Y) + 'px';
                    label.style.transform = 'translateY(-50%)';
                    gameArea.appendChild(label);
                }
            }
        }
        drawAxisLabels();

        let score = 0;
        let timeLeft = 60;
        let gameInterval;
        let targetX = 0;

        const xOptions = [-200, -150, -100, -50, 50, 100, 150, 200];

        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                const now = audioCtx.currentTime;
                if(type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1046.50, now); 
                    osc.frequency.setValueAtTime(1318.51, now + 0.1); 
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now); osc.stop(now + 0.5);
                } else if(type === 'miss') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                }
            } catch(e) {}
        }

        function startGame() {
            score = 0;
            timeLeft = 60;
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft + '초';
            
            startOverlay.style.display = 'none';
            resultOverlay.style.display = 'none';
            
            document.querySelectorAll('.click-marker, .click-tooltip, .alien-anim').forEach(el => el.remove());

            setNewTarget();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateTime, 1000);
        }

        function updateTime() {
            timeLeft--;
            timeDisplay.textContent = timeLeft + '초';
            if (timeLeft <= 0) endGame();
        }

        function setNewTarget() {
            targetX = xOptions[Math.floor(Math.random() * xOptions.length)];
            missionDisplay.innerHTML = `<span style="color:#ff4757;">X : ${targetX}</span>`;
        }

        gameArea.addEventListener('click', function(e) {
            // ⭐️ 시작 또는 결과 오버레이 창을 클릭했을 때는 반응하지 않도록 차단
            if (e.target.closest('#start-overlay') || e.target.closest('#result-overlay')) return;

            if (timeLeft <= 0 || startOverlay.style.display !== 'none') return;

            const rect = gameArea.getBoundingClientRect();
            const clickX_px = e.clientX - rect.left; 
            const clickY_px = e.clientY - rect.top;

            let mathX = (clickX_px - CENTER_X) / SCALE;
            let mathY = -(clickY_px - CENTER_Y) / SCALE;

            mathX = Math.round(mathX / 10) * 10;
            mathY = Math.round(mathY / 10) * 10;

            if(mathX < -220 || mathX > 220 || mathY < -120 || mathY > 120) return;

            if (mathX === targetX && Math.abs(mathY) <= 10) {
                playSound('success');
                score++;
                scoreDisplay.textContent = score;

                const alien = document.createElement('div');
                alien.className = 'alien-anim';
                alien.textContent = '👽'; 
                
                alien.style.left = (targetX * SCALE + CENTER_X) + 'px';
                alien.style.top = CENTER_Y + 'px';
                gameArea.appendChild(alien);

                setTimeout(() => {
                    alien.remove();
                    setNewTarget();
                }, 800);
                
            } else {
                playSound('miss');
                
                const marker = document.createElement('div');
                marker.className = 'click-marker';
                marker.style.left = (mathX * SCALE + CENTER_X) + 'px';
                marker.style.top = (-mathY * SCALE + CENTER_Y) + 'px';
                
                const tooltip = document.createElement('div');
                tooltip.className = 'click-tooltip';
                tooltip.textContent = `여긴 X: ${mathX}`;
                tooltip.style.left = (mathX * SCALE + CENTER_X) + 'px';
                tooltip.style.top = (-mathY * SCALE + CENTER_Y) + 'px';

                gameArea.appendChild(marker);
                gameArea.appendChild(tooltip);

                setTimeout(() => { marker.remove(); tooltip.remove(); }, 1500);
            }
        });

        function endGame() {
            clearInterval(gameInterval);
            document.getElementById('final-score').textContent = score;
            
            if (score >= 15) {
                feedbackMsg.innerHTML = "와우! 외계인 친구들의 인기스타네요!<br>X좌표 가로 위치 찾기는 마스터 완료! 🚀";
                feedbackMsg.style.color = "#ff4757";
            } else if (score >= 10) {
                feedbackMsg.innerHTML = "참 잘했어요!<br>외계인 친구들을 아주 잘 찾아주었군요! 👏";
                feedbackMsg.style.color = "#f0932b";
            } else {
                feedbackMsg.innerHTML = "좋아요!<br>가로 방향(X축) 눈금을 보고<br>위치를 찾는 연습을 조금 더 해봐요! 😉";
                feedbackMsg.style.color = "#1e90ff";
            }

            resultOverlay.style.display = 'flex';
        }
    </script>
</body>
</html>
