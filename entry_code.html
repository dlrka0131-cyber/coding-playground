<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>엔트리 코드 놀이터</title>
<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root{
    --bg:#fff8ec; --ink:#4a3b2c; --soft:#8a7660; --line:#f0dcc0;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font-family:'Pretendard',sans-serif;min-height:100vh;background-color:#fff6fb;
    background-image:linear-gradient(180deg,#ffe6f2 0%,#fff6dc 50%,#e2f5ff 100%);background-attachment:fixed}
  .home{font-family:inherit;font-size:17px;font-weight:800;color:#fff;background:#ff7fa8;border-radius:999px;padding:6px 20px 6px 6px;
    display:inline-flex;align-items:center;gap:10px;box-shadow:0 5px 0 #e35d8a;transition:transform .1s,box-shadow .1s}
  .home .hi{width:34px;height:34px;border-radius:50%;background:#fff;color:#ff7fa8;display:inline-flex;align-items:center;justify-content:center;font-size:20px}
  .home:hover{transform:translateY(-2px);box-shadow:0 7px 0 #e35d8a}
  .home:active{transform:translateY(3px);box-shadow:0 2px 0 #e35d8a}
  body{display:flex;flex-direction:column}
  .wrap{flex:1 0 auto;width:100%}
  footer{position:relative;z-index:1;background:#63C24B;text-align:center;flex:0 0 auto;
    padding:clamp(8px,1.4vh,14px) 24px clamp(10px,2vh,22px);font-family:'Dongle',sans-serif;font-weight:700;
    font-size:clamp(17px,2.8vh,24px);color:#fff;text-shadow:0 1px 3px rgba(31,22,55,.25)}
  a{color:inherit;text-decoration:none}
  .wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:28px 16px 60px}
  .deco{position:fixed;font-size:36px;pointer-events:none;z-index:0;animation:drift 6s ease-in-out infinite}

  /* ---------- 목록 ---------- */
  .hero{text-align:center;margin:10px 0 34px}
  .hero .logo{font-size:60px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
  .hero h1{font-size:48px;font-weight:900;margin:6px 0 14px;letter-spacing:1px}
  .hero h1 b{display:inline-block;font-weight:900;animation:bob 2.4s ease-in-out infinite;
    text-shadow:3px 0 #fff,-3px 0 #fff,0 3px #fff,0 -3px #fff,2px 2px #fff,-2px -2px #fff,2px -2px #fff,-2px 2px #fff,0 7px 0 rgba(180,90,130,.18)}
  .hero p{display:inline-block;background:#fff;border-radius:999px;padding:9px 22px;font-size:18px;font-weight:700;color:#d2557f;
    box-shadow:0 5px 0 #ffd0e2;margin:0}
  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
  @media (max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
  .card{position:relative;border-radius:28px;padding:22px 18px 20px;text-align:center;border:4px solid #fff;
    box-shadow:0 6px 0 rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s;cursor:pointer}
  .card:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 12px 0 rgba(0,0,0,.08)}
  .card:active{transform:translateY(0)}
  .card .no{position:absolute;top:12px;left:14px;width:34px;height:34px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:18px}
  .card .em{font-size:64px;line-height:1.2;margin:8px 0 6px}
  .card{padding:20px 12px 18px}
  .card .em{font-size:54px}
  .card h3{font-size:19px;font-weight:800;margin:0 0 6px;word-break:keep-all}
  .card p{font-size:14px;font-weight:500;margin:0;opacity:.75;line-height:1.4;word-break:keep-all}
  .card .no{font-weight:800}
  .btn{font-weight:700}
  .title h2{font-weight:800}

  /* ---------- 상세 ---------- */
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .btn{font-family:inherit;font-size:18px;border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;
    padding:8px 18px;cursor:pointer;box-shadow:0 4px 0 var(--ink);display:inline-flex;align-items:center;gap:6px}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .btn.ghost{border-color:var(--line);box-shadow:0 4px 0 var(--line)}
  .title{display:flex;align-items:center;gap:14px;margin:4px 0 6px}
  .title .em{font-size:54px}
  .title h2{font-size:38px;margin:0}
  .title .no{font-size:18px;background:#ff7a59;color:#fff;border-radius:999px;padding:4px 12px}
  .desc{font-size:20px;color:var(--soft);margin:0 0 22px}
  .panes{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px}
  @media (max-width:820px){.panes{grid-template-columns:minmax(0,1fr)}}
  .box{background:#fff;border-radius:26px;border:3px solid var(--line);padding:18px}
  .box h4{margin:0 0 12px;font-size:20px;display:flex;align-items:center;gap:6px}
  .stage{position:relative;height:240px;border-radius:18px;background:#eaf7ff;overflow:hidden;
    background-image:linear-gradient(#bfe6c4,#bfe6c4);background-size:100% 36px;background-position:bottom;background-repeat:no-repeat}
  .ch{position:absolute;left:50%;bottom:36px;font-size:64px;line-height:1;transform:translateX(-50%);user-select:none}
  .bubble{position:absolute;left:50%;bottom:120px;transform:translateX(-10%);background:#fff;border:3px solid var(--ink);
    border-radius:16px;padding:6px 12px;font-size:17px;white-space:nowrap}
  .ctrls{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .hint{font-size:15px;color:var(--soft);text-align:center;margin:10px 0 0}
  .code{overflow-x:auto;padding:14px 8px 18px 14px;border-radius:18px;background:#f6f9fc;
    background-image:radial-gradient(#dfe6ee 1.2px,transparent 1.2px);background-size:16px 16px}
  .scripts{display:flex;flex-wrap:wrap;gap:34px 40px;align-items:flex-start}
  .key{font-family:inherit;font-weight:800;font-size:20px;color:#fff;background:#5b8def;border:0;border-radius:18px;
    padding:14px 26px;box-shadow:0 6px 0 #3e6cc9;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s,box-shadow .08s}
  .key i{font-size:24px}
  .key:active,.key.on{transform:translateY(4px);box-shadow:0 2px 0 #3e6cc9}
  .key.wide{min-width:240px}
  .score{position:absolute;left:12px;top:12px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-size:18px;font-weight:800}
  .frames{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;color:var(--soft)}
  .fr{background:#fffaf0;border:3px solid var(--line);border-radius:14px;padding:6px 10px 4px;text-align:center;font-size:30px;line-height:1.15;transition:transform .1s}
  .fr small{display:block;font-size:12px;font-weight:700;color:var(--soft)}
  .fr.on{border-color:#ff7a59;background:#ffece5;transform:scale(1.1)}
  .pill{font-family:inherit;font-weight:700;font-size:15px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer}
  .pill.on{background:#ff7a59;border-color:#ff7a59;color:#fff}
  .hint b{color:#ff7a59}
  .drawsq{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 4s linear infinite}
  .nav{display:flex;justify-content:space-between;margin-top:24px;gap:10px}

  /* ---------- 엔트리 블록 ---------- */
  .ec{display:flex;flex-direction:column;align-items:flex-start;
    font-size:17px;font-weight:700;color:#fff}
  .stack{margin-left:22px;display:flex;flex-direction:column;align-items:flex-start}
  .b{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 6px 0 16px;border-radius:4px 22px 22px 4px;
    position:relative;white-space:nowrap;background:var(--c);border:1.5px solid var(--k)}
  .b::after{content:"";position:absolute;left:10px;bottom:-9px;border-left:9px solid transparent;border-right:9px solid transparent;
    border-top:9px solid var(--c);z-index:2}
  .b .ic{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:19px;background:var(--k)}
  .b.hat{padding-left:58px;border-radius:22px}
  .b.hat .hc{position:absolute;left:-4px;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:#fff;
    border:4px solid var(--c);display:flex;align-items:center;justify-content:center;color:var(--c);font-size:24px}
  .b.chead{border-radius:4px 22px 22px 0;border-bottom:0}
  .cbody{display:flex}
  .arm{width:24px;background:var(--c);border-left:1.5px solid var(--k)}
  .kids{display:flex;flex-direction:column;align-items:flex-start;padding:0 0 0 0}
  .b.foot{height:22px;width:190px;border-radius:0 12px 12px 4px;padding:0;border-top:0}
  .num{background:#ffe08c;border:1.5px solid #f2a62a;color:#3a2a00;border-radius:16px;padding:3px 12px;font-size:15px}
  .txt{background:#fff;border:1.5px solid rgba(0,0,0,.15);color:#333;border-radius:6px;padding:3px 10px;font-size:15px}
  .dd{background:var(--d);border-radius:4px;padding:4px 8px 4px 10px;font-size:15px}
  .start{--c:#0db33c;--k:#0a9632;--d:#09902f}
  .flow{--c:#3dbbea;--k:#2b9fd1;--d:#2b9fd1}
  .looks{--c:#ff3d64;--k:#e0264f;--d:#d0284a}
  .move{--c:#a94af0;--k:#8c33d4;--d:#8c33d4}
  .sound{--c:#7cc11d;--k:#63a00f;--d:#5e980e}
  .brush{--c:#ff9b00;--k:#e08600;--d:#d98000}
  .data{--c:#e05fd0;--k:#c247b3;--d:#b9409f}
  .calc{--c:#f4af18;--k:#d9930a;--d:#d9930a}
  .rep{display:inline-flex;align-items:center;gap:6px;background:var(--c);border:1.5px solid var(--k);border-radius:18px;padding:3px 10px 3px 4px;font-size:15px}

  /* ---------- 미리보기 움직임 ---------- */
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes jump{0%,100%{bottom:36px}50%{bottom:136px}}
  @keyframes run{0%{left:12%;transform:translateX(-50%) scaleX(-1)}49%{transform:translateX(-50%) scaleX(-1)}
    50%{left:88%;transform:translateX(-50%) scaleX(1)}100%{left:12%;transform:translateX(-50%) scaleX(1)}}
  @keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
  @keyframes grow{0%,100%{transform:translateX(-50%) scale(.7)}50%{transform:translateX(-50%) scale(1.4)}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes wiggle{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-15deg)}75%{transform:translateX(-50%) rotate(15deg)}}
  @keyframes hue{to{filter:hue-rotate(360deg)}}
  @keyframes orbit{from{transform:translateX(-50%) rotate(0) translateX(70px)}to{transform:translateX(-50%) rotate(360deg) translateX(70px)}}
  @keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-30px)}}
  @keyframes fade{from{opacity:1}to{opacity:0}}
  @keyframes draw{0%{stroke-dashoffset:400}80%,100%{stroke-dashoffset:0}}
  @keyframes drift{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}
  .jumping{animation:jump .7s ease-in-out}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<footer>제작: 김정이 선생님 ❤️ | © 2026 Coding Playground</footer>

<script>
/* 블록 데이터
   대본: 문자열 = 글자, {n} = 숫자칸, {t} = 글자칸, {d} = 고르는 칸
   블록: {c:분류, p:[...], i:아이콘, k:[안쪽 블록들]}  (k가 있으면 감싸는 블록) */
const N = v => ({n:v}), T = v => ({t:v}), D = v => ({d:v});
const wait = s => ({c:'flow', p:[N(s), '초 기다리기']});
const loop = k => ({c:'flow', p:['계속 반복하기'], k});
const times = (n, k) => ({c:'flow', p:[N(n), '번 반복하기'], k});
// 블록 안에 끼워 넣는 동그란 블록 (예: 계산 블록의 무작위 수)
const rnd = (a, b) => ({r:{c:'calc', p:[N(a), '부터', N(b), '사이의 무작위 수']}});
const START = {i:'player-play', p:['시작하기 버튼을 클릭했을 때']};
const CLICK = {i:'hand-click', p:['오브젝트를 클릭했을 때']};
const KEY = k => ({i:'keyboard', p:[D(k), '키를 눌렀을 때']});

const ITEMS = [
  {em:'🐣', ch:'🥚', bg:'#ffe9a8', t:'애니메이션', s:'그림을 하나씩 빠르게 바꾸면 움직이는 것처럼 보여요', pv:'frames', frames:['🥚','🐣','🐥'],
   scripts:[{h:{i:'player-play', p:['시작하기 버튼을 클릭했을 때']}, b:[
     loop([{c:'looks', p:[D('다음'), '모양으로 바꾸기']}, wait('0.1')])]}]},
  {em:'🐸', ch:'🐸', bg:'#c9f2c0', t:'점프하기', s:'스페이스 키를 누르면 폴짝 뛰어올라요', pv:'jump',
   scripts:[{h:{i:'keyboard', p:[D('스페이스'), '키를 눌렀을 때']}, b:[
     times(10, [{c:'move', p:['y 좌표를', N(10), '만큼 바꾸기']}]),
     times(10, [{c:'move', p:['y 좌표를', N(-10), '만큼 바꾸기']}])]}]},
  {em:'🚗', ch:'🚗', bg:'#c8e6ff', t:'화살표로 움직이기', s:'화살표 키로 왼쪽, 오른쪽으로 움직여요', pv:'arrows',
   scripts:[
     {h:{i:'keyboard', p:[D('오른쪽 화살표'), '키를 눌렀을 때']}, b:[{c:'move', p:['x 좌표를', N(10), '만큼 바꾸기']}]},
     {h:{i:'keyboard', p:[D('왼쪽 화살표'), '키를 눌렀을 때']}, b:[{c:'move', p:['x 좌표를', N(-10), '만큼 바꾸기']}]}]},
  {em:'⚽', ch:'⚽', bg:'#ffd6cc', t:'벽에 튕기기', s:'계속 가다가 벽에 닿으면 반대로 돌아와요', pv:'bounce',
   scripts:[{h:{i:'player-play', p:['시작하기 버튼을 클릭했을 때']}, b:[
     loop([{c:'move', p:['이동 방향으로', N(5), '만큼 움직이기']}, {c:'move', p:['화면 끝에 닿으면 튕기기']}])]}]},
  {em:'💬', ch:'🤖', bg:'#e6dcff', t:'말하기', s:'말풍선으로 친구에게 인사해요', pv:'talk', lines:['안녕!', '나는 엔트리봇이야'],
   scripts:[{h:{i:'player-play', p:['시작하기 버튼을 클릭했을 때']}, b:[
     {c:'looks', p:[T('안녕!'), '을(를)', N(2), '초 동안 말하기']},
     {c:'looks', p:[T('나는 엔트리봇이야'), '을(를)', N(2), '초 동안 말하기']}]}]},
  {em:'🌀', ch:'⭐', bg:'#fff3b8', t:'빙글빙글 돌기', s:'방향을 조금씩 계속 돌려요', pv:'spin',
   scripts:[{h:{i:'player-play', p:['시작하기 버튼을 클릭했을 때']}, b:[
     loop([{c:'move', p:['방향을', N(10), '만큼 회전하기']}])]}]},
  {em:'🎈', ch:'🎈', bg:'#ffd3e6', t:'커졌다 작아지기', s:'풍선처럼 커졌다가 작아져요', pv:'grow',
   scripts:[{h:{i:'player-play', p:['시작하기 버튼을 클릭했을 때']}, b:[
     loop([times(10, [{c:'looks', p:['크기를', N(5), '만큼 바꾸기']}]),
           times(10, [{c:'looks', p:['크기를', N(-5), '만큼 바꾸기']}])])]}]},
  {em:'🐭', ch:'🐭', bg:'#d9f5ef', t:'마우스 따라가기', s:'마우스가 가는 곳으로 졸졸 따라가요', pv:'follow',
   scripts:[{h:{i:'player-play', p:['시작하기 버튼을 클릭했을 때']}, b:[
     loop([{c:'move', p:[D('마우스포인터'), '위치로 이동하기']}])]}]},
  {em:'🐶', ch:'🐶', bg:'#ffe2c2', t:'누르면 소리 내기', s:'강아지를 클릭하면 멍멍 짖어요', pv:'click',
   scripts:[{h:{i:'hand-click', p:['오브젝트를 클릭했을 때']}, b:[
     {c:'sound', p:['소리', D('강아지 짖는 소리'), '재생하기']},
     {c:'looks', p:[D('다음'), '모양으로 바꾸기']}]}]},
  {em:'👻', ch:'👻', bg:'#e3e8f0', t:'숨바꼭질', s:'나타났다 사라졌다 해요', pv:'hide',
   scripts:[{h:{i:'player-play', p:['시작하기 버튼을 클릭했을 때']}, b:[
     loop([{c:'looks', p:['모양 숨기기']}, wait('0.5'), {c:'looks', p:['모양 보이기']}, wait('0.5')])]}]},
  {em:'🐰', ch:'🐰', t:'순간이동', s:'1초마다 아무 곳으로 뿅 하고 나타나요', pv:'teleport',
   scripts:[{h:START, b:[loop([{c:'move', p:['x:', rnd(-200, 200), 'y:', rnd(-100, 100), '위치로 이동하기']}, wait(1)])]}]},
  {em:'✏️', ch:'✏️', t:'네모 그리기', s:'붓으로 네모를 그려요', pv:'draw',
   scripts:[{h:START, b:[{c:'brush', p:['그리기 시작하기']},
     times(4, [{c:'move', p:['이동 방향으로', N(100), '만큼 움직이기']}, {c:'move', p:['방향을', N(90), '만큼 회전하기']}])]}]},
  {em:'🦄', ch:'🦄', t:'무지개 색 바꾸기', s:'색깔이 알록달록 계속 바뀌어요', pv:'hue',
   scripts:[{h:START, b:[loop([{c:'looks', p:[D('색깔'), '효과를', N(10), '만큼 주기']}, wait('0.1')])]}]},
  {em:'🚀', ch:'🚀', t:'카운트다운', s:'3, 2, 1 숫자를 세고 출발해요', pv:'talk', lines:['3', '2', '1', '출발!'], ms:1000,
   scripts:[{h:START, b:['3', '2', '1', '출발!'].map(w => ({c:'looks', p:[T(w), '을(를)', N(1), '초 동안 말하기']}))}]},
  {em:'🦋', ch:'🦋', t:'동그랗게 날기', s:'조금 가고 조금 돌면 동그라미를 그리며 날아요', pv:'orbit',
   scripts:[{h:START, b:[loop([{c:'move', p:['이동 방향으로', N(5), '만큼 움직이기']}, {c:'move', p:['방향을', N(5), '만큼 회전하기']}])]}]},
  {em:'☁️', ch:'☁️', t:'둥실둥실', s:'구름처럼 위아래로 둥실둥실 떠다녀요', pv:'float',
   scripts:[{h:START, b:[loop([times(10, [{c:'move', p:['y 좌표를', N(2), '만큼 바꾸기']}]),
     times(10, [{c:'move', p:['y 좌표를', N(-2), '만큼 바꾸기']}])])]}]},
  {em:'✨', ch:'🧚', t:'스르르 사라지기', s:'조금씩 투명해지다가 사라져요', pv:'fade',
   scripts:[{h:START, b:[times(10, [{c:'looks', p:[D('투명도'), '효과를', N(10), '만큼 주기']}, wait('0.1')])]}]},
  {em:'🍄', ch:'🍄', t:'누르면 커지기', s:'클릭할 때마다 쑥쑥 커져요', pv:'clickgrow',
   scripts:[{h:CLICK, b:[{c:'looks', p:['크기를', N(10), '만큼 바꾸기']}]}]},
  {em:'🎹', ch:'🎹', t:'키보드 피아노', s:'키를 누르면 피아노 소리가 나요', pv:'piano',
   scripts:[['a', '도'], ['s', '레'], ['d', '미']].map(([k, n]) =>
     ({h:KEY(k), b:[{c:'sound', p:['소리', D('피아노_' + n), '재생하기']}]}))},
  {em:'🌟', ch:'🌟', t:'점수 올리기', s:'별을 클릭할 때마다 점수가 1점씩 올라가요', pv:'score',
   scripts:[{h:START, b:[{c:'data', p:[D('점수'), '를', N(0), '(으)로 정하기']}]},
            {h:CLICK, b:[{c:'data', p:[D('점수'), '에', N(1), '만큼 더하기']}]}]},
];

const ICON = {flow:'hierarchy', move:'arrows-move', looks:'circles', sound:'volume', brush:'brush', data:'database'};

/* ---------- 블록 그리기 ---------- */
let z;
const part = p => typeof p === 'string' ? `<span>${p}</span>`
  : p.n !== undefined ? `<span class="num">${p.n}</span>`
  : p.t !== undefined ? `<span class="txt">${p.t}</span>`
  : p.r ? `<span class="rep ${p.r.c}">${parts(p.r.p)}</span>`
  : `<span class="dd">${p.d} ▾</span>`;
const parts = ps => ps.map(part).join('');
const icon = c => `<span class="ic"><i class="ti ti-${ICON[c]}"></i></span>`;

function block(bk){
  if (!bk.k) return `<div class="b ${bk.c}" style="z-index:${z--}">${parts(bk.p)}${icon(bk.c)}</div>`;
  return `<div class="b chead ${bk.c}" style="z-index:${z--}">${parts(bk.p)}${icon(bk.c)}</div>
    <div class="cbody ${bk.c}"><div class="arm"></div><div class="kids">${bk.k.map(block).join('')}</div></div>
    <div class="b foot ${bk.c}" style="z-index:${z--}"></div>`;
}
function script(s){
  z = 500;
  return `<div class="ec">
    <div class="b hat start" style="z-index:${z--}"><span class="hc"><i class="ti ti-${s.h.i}"></i></span>${parts(s.h.p)}</div>
    <div class="stack">${s.b.map(block).join('')}</div></div>`;
}

/* ---------- 화면 ---------- */
const app = document.getElementById('app');
let timers = [], cleanups = [];
function reset(){ timers.forEach(clearInterval); timers = []; cleanups.forEach(f => f()); cleanups = []; }

const PAL = ['#ffe08a', '#b9f0c4', '#c2e4ff', '#ffc8dc', '#e3d6ff', '#ffd6ad', '#c3f1eb', '#fff1a6', '#ffcfc4', '#d6f5b0'];
const DECO = [['☁️', 4, 10, 0], ['⭐', 90, 8, 1], ['🌈', 3, 55, 2], ['💖', 93, 42, 3], ['🍭', 91, 80, 1.5], ['☁️', 82, 22, 2.5], ['✨', 8, 86, .5], ['🎀', 14, 30, 3.5]];
const RAINBOW = ['#ff6b8b', '#ff9f43', '#f5c400', '#3ccf7a', '#3ab0ff', '#8e7dff'];
function home(){
  let ci = 0;
  const title = [...'엔트리 코드 놀이터'].map(c => c === ' ' ? ' '
    : `<b style="color:${RAINBOW[ci % RAINBOW.length]};animation-delay:${(ci++) * 0.12}s">${c}</b>`).join('');
  app.innerHTML = `
    <div class="top"><a class="home" href="index.html"><span class="hi"><i class="ti ti-arrow-left"></i></span>코딩 놀이터</a></div>
    ${DECO.map(([e, x, y, d]) => `<span class="deco" style="left:${x}%;top:${y}%;animation-delay:${d}s">${e}</span>`).join('')}
    <div class="hero"><div class="logo">🧩</div>
      <h1>${title}</h1>
      <p>블록은 마법 명령어 🪄 나는 꼬마 마법 개발자 🧙 엔트리 친구들을 움직여 볼까요?</p></div>
    <div class="grid">${ITEMS.map((it, i) => `
      <a class="card" href="#/${i + 1}" style="background:${PAL[i % PAL.length]}">
        <span class="no">${i + 1}</span><div class="em">${it.em}</div>
        <h3>${it.t}</h3><p>${it.s}</p></a>`).join('')}</div>`;
}

function detail(i){
  const it = ITEMS[i];
  app.innerHTML = `
    <div class="top">
      <a class="home" href="#/"><span class="hi"><i class="ti ti-home"></i></span>처음으로</a>
    </div>
    <div class="title"><span class="em">${it.em}</span><h2>${it.t}</h2><span class="no">${i + 1}번</span></div>
    <p class="desc">${it.s}</p>
    <div class="panes">
      <div class="box"><h4><i class="ti ti-eye"></i> 이렇게 움직여요</h4>
        <div class="stage" id="stage"><div class="ch" id="ch">${it.ch}</div></div>
        <div id="ctrls"></div></div>
      <div class="box"><h4><i class="ti ti-puzzle"></i> 엔트리 코드</h4>
        <div class="code"><div class="scripts">${it.scripts.map(script).join('')}</div></div></div>
    </div>
    <div class="nav">
      ${i > 0 ? `<a class="btn ghost" href="#/${i}"><i class="ti ti-chevron-left"></i> ${ITEMS[i - 1].t}</a>` : '<span></span>'}
      ${i < ITEMS.length - 1 ? `<a class="btn ghost" href="#/${i + 2}">${ITEMS[i + 1].t} <i class="ti ti-chevron-right"></i></a>` : '<span></span>'}
    </div>`;
  preview(it);
}

/* ---------- 미리보기 ---------- */
function preview(it){
  const stage = document.getElementById('stage'), ch = document.getElementById('ch'), ctrls = document.getElementById('ctrls');
  const hint = t => ctrls.innerHTML = `<p class="hint">${t}</p>`;
  const onKey = f => { addEventListener('keydown', f); cleanups.push(() => removeEventListener('keydown', f)); };
  const flash = id => { const b = document.getElementById(id); b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 120); };
  const pop = () => { ch.style.animation = 'none'; void ch.offsetWidth; ch.style.animation = 'wiggle .4s'; };

  switch (it.pv){
    case 'frames': {
      let f = 0, t;
      ctrls.innerHTML = `<div class="frames">${it.frames.map((e, i) =>
          `<div class="fr" id="fr${i}"><span>${e}</span><small>모양 ${i + 1}</small></div>`).join('<i class="ti ti-chevron-right"></i>')}</div>
        <div class="ctrls"><button class="pill on" data-ms="700">천천히 보기</button><button class="pill" data-ms="100">코드대로 0.1초</button></div>
        <p class="hint">그림(모양)을 하나씩 빠르게 바꿔 보여 주면 살아 움직이는 것처럼 보여요.<br>이게 바로 <b>애니메이션</b>이에요!</p>`;
      const show = () => {
        ch.textContent = it.frames[f];
        it.frames.forEach((_, i) => document.getElementById('fr' + i).classList.toggle('on', i === f));
        f = (f + 1) % it.frames.length;
      };
      const run = ms => { clearInterval(t); t = setInterval(show, ms); timers.push(t); };
      ctrls.querySelectorAll('.pill').forEach(b => b.onclick = () => {
        ctrls.querySelectorAll('.pill').forEach(x => x.classList.toggle('on', x === b)); run(+b.dataset.ms);
      });
      show(); run(700); break;
    }
    case 'jump': {
      const go = () => { ch.classList.remove('jumping'); void ch.offsetWidth; ch.classList.add('jumping'); };
      ctrls.innerHTML = `<div class="ctrls"><button class="key wide" id="go"><i class="ti ti-space"></i> 스페이스</button></div><p class="hint">버튼을 누르거나 키보드 스페이스 키를 눌러 보세요</p>`;
      document.getElementById('go').onclick = go;
      onKey(e => { if (e.code === 'Space'){ e.preventDefault(); go(); flash('go'); } }); break;
    }
    case 'arrows': {
      let x = 50;
      const mv = d => { x = Math.max(10, Math.min(90, x + d)); ch.style.left = x + '%'; ch.style.transform = `translateX(-50%) scaleX(${d > 0 ? -1 : 1})`; };
      ch.style.transition = 'left .15s';
      ctrls.innerHTML = `<div class="ctrls"><button class="key" id="l" aria-label="왼쪽"><i class="ti ti-arrow-left"></i></button><button class="key" id="r" aria-label="오른쪽"><i class="ti ti-arrow-right"></i></button></div><p class="hint">버튼을 누르거나 키보드 화살표 키를 눌러 보세요</p>`;
      document.getElementById('l').onclick = () => mv(-8);
      document.getElementById('r').onclick = () => mv(8);
      onKey(e => { if (e.key === 'ArrowLeft'){ mv(-8); flash('l'); } if (e.key === 'ArrowRight'){ mv(8); flash('r'); } }); break;
    }
    case 'bounce':
      ch.style.animation = 'run 3s linear infinite'; hint('벽에 닿으면 반대로 가요'); break;
    case 'talk': {
      const b = document.createElement('div'); b.className = 'bubble'; stage.appendChild(b);
      let n = 0;
      const step = () => { const l = it.lines[n % (it.lines.length + 1)]; b.style.display = l ? '' : 'none'; b.textContent = l || ''; n++; };
      const ms = it.ms || 2000;
      step(); timers.push(setInterval(step, ms));
      hint(`${ms / 1000}초씩 차례대로 말해요`); break;
    }
    case 'spin':
      ch.style.animation = 'spin 2s linear infinite'; hint('계속 빙글빙글 돌아요'); break;
    case 'grow':
      ch.style.animation = 'grow 2s ease-in-out infinite'; hint('커졌다가 다시 작아져요'); break;
    case 'follow': {
      ch.style.transition = 'left .1s, bottom .1s';
      const m = e => { const r = stage.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e;
        ch.style.left = (p.clientX - r.left) + 'px'; ch.style.bottom = (r.bottom - p.clientY - 32) + 'px'; };
      stage.addEventListener('mousemove', m); stage.addEventListener('touchmove', m, {passive:true});
      stage.style.cursor = 'crosshair';
      hint('미리보기 칸 위에서 마우스를 움직여 보세요'); break;
    }
    case 'click': {
      const b = document.createElement('div'); b.className = 'bubble'; b.style.display = 'none'; b.textContent = '멍멍!'; stage.appendChild(b);
      ch.style.cursor = 'pointer';
      ch.onclick = () => {
        ch.textContent = ch.textContent === '🐶' ? '🐕' : '🐶';
        ch.style.animation = 'none'; void ch.offsetWidth; ch.style.animation = 'wiggle .4s';
        b.style.display = ''; clearTimeout(ch._t); ch._t = setTimeout(() => b.style.display = 'none', 900);
      };
      hint('강아지를 클릭해 보세요'); break;
    }
    case 'hide':
      ch.style.animation = 'blink 1s steps(1) infinite'; hint('0.5초마다 숨었다 나타나요'); break;
    case 'teleport': {
      const tp = () => { ch.style.left = (12 + Math.random() * 76) + '%'; ch.style.bottom = (36 + Math.random() * 120) + 'px'; };
      timers.push(setInterval(tp, 1000)); hint('1초마다 아무 곳으로 뿅!'); break;
    }
    case 'draw':
      ch.style.display = 'none';
      stage.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 200 200" style="position:absolute;left:50%;top:10px;width:180px;transform:translateX(-50%)"><path class="drawsq" d="M50 150 H150 V50 H50 Z" fill="none" stroke="#ff9b00" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/></svg>`);
      hint('100만큼 가고 90도 돌기를 4번 하면 네모!'); break;
    case 'hue':
      ch.style.animation = 'hue 2s linear infinite'; hint('색깔이 조금씩 계속 바뀌어요'); break;
    case 'orbit':
      ch.style.bottom = '80px'; ch.style.animation = 'orbit 3s linear infinite'; hint('조금 가고 조금 돌면 동그라미가 돼요'); break;
    case 'float':
      ch.style.bottom = '70px'; ch.style.animation = 'float 2s ease-in-out infinite'; hint('위로 조금, 아래로 조금 계속 반복해요'); break;
    case 'fade':
      ch.style.animation = 'fade 2s steps(10, end) infinite'; hint('투명도를 10씩 올리면 스르르 사라져요'); break;
    case 'clickgrow': {
      let s = 1;
      ch.style.cursor = 'pointer'; ch.style.transformOrigin = '50% 100%'; ch.style.transition = 'transform .15s';
      ch.onclick = () => { s = s >= 2 ? 1 : s + 0.15; ch.style.transform = `translateX(-50%) scale(${s})`; };
      hint('버섯을 클릭해 보세요 (너무 커지면 처음 크기로 돌아와요)'); break;
    }
    case 'piano': {
      const notes = [['a', '도', 262, '#ff6b8b', '#d94a6a'], ['s', '레', 294, '#ffa43a', '#d9821c'], ['d', '미', 330, '#3ab0ff', '#1b8bd6']];
      let ac;
      const play = (f, id) => {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.4, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.8);
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.8);
        flash(id); pop();
      };
      ctrls.innerHTML = `<div class="ctrls">${notes.map(([k, n, , c, d]) =>
        `<button class="key" id="k${k}" style="background:${c};box-shadow:0 6px 0 ${d}">${n} <small style="opacity:.8">${k.toUpperCase()}</small></button>`).join('')}</div>
        <p class="hint">버튼을 누르거나 키보드 A, S, D 키를 눌러 보세요</p>`;
      notes.forEach(([k, , f]) => document.getElementById('k' + k).onclick = () => play(f, 'k' + k));
      onKey(e => { const n = notes.find(x => x[0] === e.key.toLowerCase()); if (n) play(n[2], 'k' + n[0]); }); break;
    }
    case 'score': {
      let score = 0;
      const b = document.createElement('div'); b.className = 'score'; b.textContent = '점수 0'; stage.appendChild(b);
      ch.style.cursor = 'pointer';
      ch.onclick = () => { b.textContent = '점수 ' + (++score); pop(); };
      hint('별을 클릭해 보세요'); break;
    }
  }
}

/* ---------- 주소로 화면 고르기 ---------- */
function show(n){
  reset(); scrollTo(0, 0);
  n >= 1 && n <= ITEMS.length ? detail(n - 1) : home();
}
const hashNum = h => parseInt((h || '').replace('#/', ''), 10);
function route(){ show(hashNum(location.hash)); }
// 주소(#) 바꾸기가 막힌 곳에서도 카드가 눌리도록 클릭을 직접 처리
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a) return;
  e.preventDefault();
  const h = a.getAttribute('href');
  show(hashNum(h));
  try { history.pushState(null, '', h); } catch (_) {}
});
addEventListener('popstate', route);
// 학생들이 실수로 개발자 도구를 열지 않도록 (코딩 놀이터 다른 페이지와 같게)
document.addEventListener('keydown', e => {
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && 'IiJjCc'.includes(e.key)) || (e.ctrlKey && 'Uu'.includes(e.key))) e.preventDefault();
});
route();
</script>
</body>
</html>
