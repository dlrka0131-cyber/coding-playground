<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="common.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⌨️ 화살표 키 X좌표 점프! ⌨️</title>
    <style>
        body {
            font-family: 'ONEMobilePOP', sans-serif;
            background-color: #192a56;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            overflow: hidden;
        }

        #main-wrapper {
            display: flex;
            gap: 25px;
            align-items: stretch;
        }

        #sidebar {
            background-color: #ffffff;
            border: 6px solid #686de0;
            border-radius: 40px;
            padding: 30px;
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            color: #ff4757;
            font-size: 36px;
            margin-bottom: 30px;
            margin-top: 0;
            line-height: 1.2;
        }

        .info-box {
            background-color: #f4f6f9;
            width: 100%;
            box-sizing: border-box;
            padding: 15px 0;
            border-radius: 20px;
            border: 3px dashed #a4b0be;
            margin-bottom: 20px;
            font-size: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .info-box .label { font-size: 22px; color: #747d8c; }

        #mission-display { font-size: 36px; font-weight: bold; }

        #current-pos { font-size: 30px; font-weight: bold; }
        .coord-x { color: #ff4757; }

        #score-display { color: #2ed573; font-weight: bold; font-size: 42px; }
        #time-display { color: #eb4d4b; font-weight: bold; font-size: 42px; }

        .sidebar-btn-group { margin-top: auto; display: flex; flex-direction: column; gap: 15px; width: 100%; }

        #game-container {
            background-color: #ffffff;
            border: 6px solid #686de0;
            border-radius: 40px;
            padding: 20px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-area {
            background-color: #fdfbf7;
            border: 4px solid #30336b;
            border-radius: 25px;
            width: 1100px;
            height: 700px;
            position: relative;
            overflow: hidden;
            background-image:
                linear-gradient(to right, rgba(189, 195, 199, 0.5) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(189, 195, 199, 0.5) 1px, transparent 1px);
            background-size: 50px 50px, 50px 50px;
            background-position: 550px 350px, 550px 350px;
        }

        .axis { position: absolute; z-index: 5; pointer-events: none; }
        .axis-x { background-color: #ff3838; width: 100%; height: 4px; top: 350px; left: 0; transform: translateY(-50%); box-shadow: 0 0 4px rgba(255, 56, 56, 0.5); }
        .axis-y { background-color: #0984e3; width: 4px; height: 100%; left: 550px; top: 0; transform: translateX(-50%); box-shadow: 0 0 4px rgba(9, 132, 227, 0.5); }

        .axis-label {
            position: absolute; font-size: 16px; color: #2c3e50; pointer-events: none; z-index: 6;
            background: rgba(253, 251, 247, 0.9); padding: 1px 5px; border-radius: 6px;
            font-family: 'Arial', sans-serif; font-weight: bold;
        }

        #player {
            position: absolute; width: 50px; height: 50px; font-size: 40px;
            display: flex; align-items: center; justify-content: center;
            transform: translate(-50%, -50%); z-index: 9;
            transition: left 0.15s ease-out, top 0.15s ease-out;
        }
        /* 자동차가 이동하는 방향을 바라보도록 좌우 반전 (기본은 왼쪽을 보고 있음) */
        #player.face-right { transform: translate(-50%, -50%) scaleX(-1); }

        #target-marker {
            position: absolute; width: 50px; height: 50px; font-size: 36px;
            display: flex; align-items: center; justify-content: center;
            transform: translate(-50%, -50%); z-index: 8;
            animation: floatFlag 1s ease-in-out infinite;
        }

        @keyframes floatFlag { 0%,100% { transform: translate(-50%, -55%); } 50% { transform: translate(-50%, -45%); } }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.92);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; border-radius: 20px;
        }
        #result-overlay { display: none; }

        .overlay h2 { font-size: 55px; color: #ff4757; margin-bottom: 20px; }
        .overlay p { font-size: 30px; color: #34495e; margin-bottom: 30px; text-align: center; line-height: 1.5; }

        /* 키 → 효과를 문장 대신 그림으로 보여주는 규칙 카드 */
        .rule-row { display: flex; gap: 25px; margin-bottom: 25px; }
        .rule-card {
            width: 170px; padding: 20px 0; border-radius: 28px; background: #ffe4e6;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .rule-key {
            width: 72px; height: 72px; border-radius: 18px; background: #ffffff; color: #2f3640;
            display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 900;
            box-shadow: 3px 3px 0 #ffb3b8;
        }
        .rule-effect { font-size: 34px; font-weight: 900; color: #ff4757; }
        .short-tip { font-size: 26px; color: #34495e; margin-bottom: 25px; }

        #feedback-msg { font-size: 28px; color: #1e90ff; margin-top: 10px; margin-bottom: 30px; font-weight: bold; text-align: center; line-height: 1.4; }

        /* ⭐️ 좌표 읽는 법 안내 모달 */
        .info-btn {
            background: none; border: 3px solid #ff4757; color: #ff4757; border-radius: 30px;
            padding: 12px 26px; font-size: 22px; font-family: 'ONEMobilePOP', sans-serif;
            cursor: pointer; margin-top: 18px;
        }
        .info-btn:active { transform: scale(0.97); }
        #start-overlay { display: none; }
        #howto-overlay { justify-content: center; }

        /* 글자 대신 그림+애니메이션으로 보여주는 X좌표 + 화살표키 사용법 */
        .howto-diagram { position: relative; width: 610px; height: 200px; margin-top: 6px; margin-bottom: 34px; }

        .howto-caption { position: absolute; top: 0; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 36px; font-weight: 900; color: #ff4757; font-family: 'ONEMobilePOP', sans-serif; opacity: 0; }
        .howto-caption-pos { animation: captionPos 12s ease-in-out infinite; }
        .howto-caption-neg { animation: captionNeg 12s ease-in-out infinite; }
        @keyframes captionPos { 0%, 3% { opacity: 0; } 6% { opacity: 1; } 47% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 0; } }
        @keyframes captionNeg { 0%, 53% { opacity: 0; } 56% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } }

        /* 지금 눌러야 할 화살표 키 (한 칸씩 움직일 때마다 노랗게 반짝!) */
        .howto-key-icon {
            position: absolute; top: 56px; left: 50%; transform: translateX(-50%);
            width: 64px; height: 64px; border-radius: 16px; background: #ffffff; color: #ff4757;
            display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900;
            box-shadow: 3px 3px 0 #ffb3b8; border: 3px solid #ff4757;
        }
        .howto-key-pos { animation: captionPos 12s ease-in-out infinite, keyBlinkPos 12s steps(1, end) infinite; }
        .howto-key-neg { animation: captionNeg 12s ease-in-out infinite, keyBlinkNeg 12s steps(1, end) infinite; }
        @keyframes keyBlinkPos {
            0%, 8% { background-color: #ffffff; }
            9% { background-color: #ffe066; }
            12% { background-color: #ffffff; }
            13.8% { background-color: #ffe066; }
            16.8% { background-color: #ffffff; }
            19.6% { background-color: #ffe066; }
            22.6% { background-color: #ffffff; }
            25.4% { background-color: #ffe066; }
            28.4% { background-color: #ffffff; }
            31.2% { background-color: #ffe066; }
            34.2% { background-color: #ffffff; }
            37% { background-color: #ffe066; }
            40%, 100% { background-color: #ffffff; }
        }
        @keyframes keyBlinkNeg {
            0%, 58% { background-color: #ffffff; }
            59% { background-color: #ffe066; }
            62% { background-color: #ffffff; }
            63.8% { background-color: #ffe066; }
            66.8% { background-color: #ffffff; }
            69.6% { background-color: #ffe066; }
            72.6% { background-color: #ffffff; }
            75.4% { background-color: #ffe066; }
            78.4% { background-color: #ffffff; }
            81.2% { background-color: #ffe066; }
            84.2% { background-color: #ffffff; }
            87% { background-color: #ffe066; }
            90%, 100% { background-color: #ffffff; }
        }

        .howto-side-label { position: absolute; top: 128px; font-size: 30px; font-weight: 900; color: #ff4757; font-family: 'Arial', sans-serif; }
        .howto-side-left { left: 6px; }
        .howto-side-right { right: 6px; }

        .howto-line { position: absolute; left: 45px; top: 158px; width: 520px; height: 6px; background: #ff3838; border-radius: 3px; }
        .howto-tick-wrap { position: absolute; top: 152px; transform: translateX(-50%); text-align: center; }
        .howto-tick-mark { width: 3px; height: 16px; background: #ff3838; opacity: 0.5; margin: 0 auto 4px; }
        .howto-tick-num { font-size: 19px; font-weight: 800; color: #a8b3c4; font-family: 'Arial', sans-serif; white-space: nowrap; }
        .howto-tick-zero .howto-tick-num { font-size: 22px; font-weight: 900; color: #2c3e50; }
        .howto-tick-zero .howto-tick-mark { background: #2c3e50; opacity: 1; }

        .howto-tick-target-pos { animation: tickHighlightPos 12s ease-in-out infinite; }
        .howto-tick-target-neg { animation: tickHighlightNeg 12s ease-in-out infinite; }
        @keyframes tickHighlightPos {
            0%, 3% { color: #a8b3c4; transform: scale(1); }
            6% { color: #ff4757; transform: scale(1.35); }
            10% { color: #ff4757; transform: scale(1.2); }
            47% { color: #ff4757; transform: scale(1.2); }
            50% { color: #a8b3c4; transform: scale(1); }
            100% { color: #a8b3c4; transform: scale(1); }
        }
        @keyframes tickHighlightNeg {
            0%, 53% { color: #a8b3c4; transform: scale(1); }
            56% { color: #ff4757; transform: scale(1.35); }
            60% { color: #ff4757; transform: scale(1.2); }
            97% { color: #ff4757; transform: scale(1.2); }
            100% { color: #a8b3c4; transform: scale(1); }
        }

        /* 자동차가 한 칸씩(1칸=1) 딱딱 끊어서 이동 — steps()로 5번의 딱-딱-딱 점프 표현 */
        .howto-cursor { position: absolute; top: 136px; font-size: 34px; animation: cursorMove 12s ease-in-out infinite; z-index: 6; }
        @keyframes cursorMove {
            0%   { left: 305px; transform: translateX(-50%) scaleX(1); }
            8%   { left: 305px; transform: translateX(-50%) scaleX(-1); animation-timing-function: steps(5, end); }
            37%  { left: 555px; transform: translateX(-50%) scaleX(-1); }
            47%  { left: 555px; transform: translateX(-50%) scaleX(-1); }
            50%  { left: 305px; transform: translateX(-50%) scaleX(1); }
            58%  { left: 305px; transform: translateX(-50%) scaleX(1); animation-timing-function: steps(5, end); }
            87%  { left: 55px; transform: translateX(-50%) scaleX(1); }
            97%  { left: 55px; transform: translateX(-50%) scaleX(1); }
            100% { left: 305px; transform: translateX(-50%) scaleX(1); }
        }

        .howto-click-pulse { position: absolute; top: 158px; width: 26px; height: 26px; margin-left: -13px; margin-top: -13px; border: 4px solid #ff4757; border-radius: 50%; opacity: 0; }
        .howto-click-pos { left: 555px; animation: clickPulsePos 12s ease-in-out infinite; }
        .howto-click-neg { left: 55px; animation: clickPulseNeg 12s ease-in-out infinite; }
        @keyframes clickPulsePos { 0%, 34% { opacity: 0; transform: scale(0.3); } 37% { opacity: 1; transform: scale(1); } 42% { opacity: 0; transform: scale(2.2); } 100% { opacity: 0; } }
        @keyframes clickPulseNeg { 0%, 84% { opacity: 0; transform: scale(0.3); } 87% { opacity: 1; transform: scale(1); } 92% { opacity: 0; transform: scale(2.2); } 100% { opacity: 0; } }

        .howto-target-char { position: absolute; top: 158px; transform: translate(-50%, -75%); font-size: 52px; opacity: 0; }
        .howto-flag-pos { left: 555px; animation: flagPopPos 12s ease-in-out infinite; }
        .howto-flag-neg { left: 55px; animation: flagPopNeg 12s ease-in-out infinite; }
        @keyframes flagPopPos {
            0%, 36% { opacity: 0; transform: translate(-50%, -75%) scale(0); }
            39% { opacity: 1; transform: translate(-50%, -75%) scale(1.3); }
            43% { opacity: 1; transform: translate(-50%, -75%) scale(1); }
            47% { opacity: 1; transform: translate(-50%, -75%) scale(1); }
            50% { opacity: 0; transform: translate(-50%, -75%) scale(0.5); }
            100% { opacity: 0; }
        }
        @keyframes flagPopNeg {
            0%, 50%, 86% { opacity: 0; transform: translate(-50%, -75%) scale(0); }
            89% { opacity: 1; transform: translate(-50%, -75%) scale(1.3); }
            93% { opacity: 1; transform: translate(-50%, -75%) scale(1); }
            97% { opacity: 1; transform: translate(-50%, -75%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -75%) scale(0.5); }
        }

        .big-action-button {
            background-color: #686de0; color: white; border: none; border-radius: 30px;
            padding: 15px 30px; font-size: 30px; font-family: 'ONEMobilePOP', sans-serif;
            cursor: pointer; transition: all 0.1s; width: 100%;
        }
        .big-action-button:active { transform: scale(0.97); }

        .home-accent { background-color: #f9ca24; color: #2c3e50; font-size: 24px; padding: 12px 20px; }

        #key-hint {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 7; pointer-events: none;
        }
        .hint-key {
            width: 46px; height: 46px; border-radius: 10px; background: #dfe4ea; color: #2f3640;
            display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold;
            border: 2px solid #a4b0be; box-shadow: 2px 2px 0 #a4b0be;
        }
    </style>
</head>
<body>

    <div id="main-wrapper">
        <div id="sidebar">
            <h1>⌨️ 화살표 키<br>X좌표 점프!</h1>

            <div class="info-box">
                <span class="label">🚩 목표 X좌표</span>
                <span id="mission-display">준비...</span>
            </div>

            <div class="info-box">
                <span class="label">📍 지금 내 X좌표</span>
                <span id="current-pos">X: 0</span>
            </div>

            <div class="info-box">
                <span class="label">🚗 도착 성공</span>
                <div><span id="score-display">0</span>번</div>
            </div>

            <div class="info-box">
                <span class="label">⏰ 남은 시간</span>
                <span id="time-display">60초</span>
            </div>

            <div class="sidebar-btn-group">
                <button class="big-action-button home-accent" onclick="location.href='xy_menu.html'">🏠 처음으로</button>
            </div>
        </div>

        <div id="game-container">
            <div id="game-area">
                <div class="axis axis-x"></div>
                <div class="axis axis-y"></div>

                <div id="player">🚗</div>
                <div id="target-marker" style="display:none;">🚩</div>

                <div id="key-hint">
                    <div class="hint-key">←</div>
                    <div class="hint-key">→</div>
                </div>

                <div id="start-overlay" class="overlay">
                    <h2>🚗 X좌표 점프!</h2>
                    <div class="rule-row">
                        <div class="rule-card">
                            <div class="rule-key">←</div>
                            <div class="rule-effect">X −1</div>
                        </div>
                        <div class="rule-card">
                            <div class="rule-key">→</div>
                            <div class="rule-effect">X +1</div>
                        </div>
                    </div>
                    <p class="short-tip">🚩 숫자만 보고 찾아가기!</p>
                    <button class="big-action-button" onclick="startGame()" style="width: auto; padding: 20px 60px; font-size: 40px; background-color: #ff4757;">▶ 시작하기!</button>
                </div>

                <div id="howto-overlay" class="overlay">
                    <h2 style="font-size: 40px; margin-top: 0; margin-bottom: 26px; color: #30336b;">🔎 X좌표 읽는 법</h2>
                    <div class="howto-diagram">
                        <div class="howto-caption howto-caption-pos">🎯 목표 X = 5</div>
                        <div class="howto-caption howto-caption-neg">🎯 목표 X = -5</div>

                        <div class="howto-key-icon howto-key-pos">→</div>
                        <div class="howto-key-icon howto-key-neg">←</div>

                        <div class="howto-line"></div>

                        <div class="howto-tick-wrap" style="left:55px;">
                            <div class="howto-tick-mark"></div>
                            <div class="howto-tick-num howto-tick-target-neg">-5</div>
                        </div>
                        <div class="howto-tick-wrap" style="left:105px;">
                            <div class="howto-tick-mark"></div>
                            <div class="howto-tick-num">-4</div>
                        </div>
                        <div class="howto-tick-wrap" style="left:155px;">
                            <div class="howto-tick-mark"></div>
                            <div class="howto-tick-num">-3</div>
                        </div>
                        <div class="howto-tick-wrap" style="left:205px;">
                            <div class="howto-tick-mark"></div>
                            <div class="howto-tick-num">-2</div>
                        </div>
                        <div class="howto-tick-wrap" style="left:255px;">
                            <div class="howto-tick-mark"></div>
                            <div class="howto-tick-num">-1</div>
                        </div>
                        <div class="howto-tick-wrap howto-tick-zero" style="left:305px;">
                            <div class="howto-tick-mark"></div>
                            <div class="howto-tick-num">0</div>
                        </div>
                        <div class="howto-tick-wrap" style="left:355px;">
                            <div class="howto-tick-mark"></div>
                            <div class="howto-tick-num">1</div>
                        </div>
                        <div class="howto-tick-wrap" style="left:405px;">
                            <div class="howto-tick-mark"></div>
                            <div class="howto-tick-num">2</div>
                        </div>
                        <div class="howto-tick-wrap" style="left:455px;">
                            <div class="howto-tick-mark"></div>
                            <div class="howto-tick-num">3</div>
                        </div>
                        <div class="howto-tick-wrap" style="left:505px;">
                            <div class="howto-tick-mark"></div>
                            <div class="howto-tick-num">4</div>
                        </div>
                        <div class="howto-tick-wrap" style="left:555px;">
                            <div class="howto-tick-mark"></div>
                            <div class="howto-tick-num howto-tick-target-pos">5</div>
                        </div>

                        <div class="howto-side-label howto-side-left">◀－</div>
                        <div class="howto-side-label howto-side-right">＋▶</div>

                        <div class="howto-click-pulse howto-click-pos"></div>
                        <div class="howto-target-char howto-flag-pos">🚩</div>

                        <div class="howto-click-pulse howto-click-neg"></div>
                        <div class="howto-target-char howto-flag-neg">🚩</div>

                        <div class="howto-cursor">🚗</div>
                    </div>
                    <button class="big-action-button" onclick="startGame()" style="width: auto; padding: 16px 50px; font-size: 32px; background-color: #ff4757;">🚀 시작하기!</button>
                </div>

                <div id="result-overlay" class="overlay">
                    <h2>탐험 종료!</h2>
                    <p>목표 좌표 도착: <span id="final-score" style="color:#ff4757; font-weight:bold;">0</span> 번!</p>
                    <p id="feedback-msg"></p>
                    <button id="next-btn" class="big-action-button" onclick="location.href='xy_key_y.html'" style="width: auto; padding: 20px 60px; font-size: 40px; background-color: #2ed573; display:none;">➡️ 다음 단계로</button>
                    <button id="retry-btn" class="big-action-button" onclick="startGame()" style="width: auto; padding: 20px 60px; font-size: 40px; background-color: #ff4757;">🔄 다시하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const missionDisplay = document.getElementById('mission-display');
        const currentPosDisplay = document.getElementById('current-pos');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const startOverlay = document.getElementById('start-overlay');
        const resultOverlay = document.getElementById('result-overlay');
        const howtoOverlay = document.getElementById('howto-overlay');
        const feedbackMsg = document.getElementById('feedback-msg');
        const player = document.getElementById('player');
        const targetMarker = document.getElementById('target-marker');
        const nextBtn = document.getElementById('next-btn');
        const retryBtn = document.getElementById('retry-btn');

        const TARGET_SCORE = 8;

        function showHowTo() {
            startOverlay.style.display = 'none';
            howtoOverlay.style.display = 'flex';
        }
        function closeHowTo() {
            howtoOverlay.style.display = 'none';
            startOverlay.style.display = 'flex';
        }

        const CENTER_X = 550;
        const CENTER_Y = 350;
        const STEP = 50; // 좌표 1칸 = 50px

        const X_MIN = -10, X_MAX = 10;
        const POS_Y = 0; // Y는 항상 0 (X축 위에서만 이동)

        let posX = 0;
        let targetX = 0;
        let score = 0;
        let timeLeft = 60;
        let gameInterval;
        let playing = false;

        // 숫자는 축 바로 아래(원래 자리)에 그대로 두고, 자동차만 축 위로 띄워서 겹치지 않게 함
        const LABEL_OFFSET = 8;
        const CAR_LIFT = 25; // 자동차를 빨간 축 선 위로 띄우는 높이(px)

        function drawAxisLabels() {
            for (let x = X_MIN; x <= X_MAX; x++) {
                if (x === 0) continue;
                let label = document.createElement('div');
                label.className = 'axis-label';
                label.textContent = x;
                label.style.color = '#ff4757';
                label.style.left = (x * STEP + CENTER_X) + 'px';
                label.style.top = (CENTER_Y + LABEL_OFFSET) + 'px';
                label.style.transform = 'translateX(-50%)';
                gameArea.appendChild(label);
            }
            let zero = document.createElement('div');
            zero.className = 'axis-label';
            zero.textContent = '0';
            zero.style.color = '#2c3e50';
            zero.style.left = (CENTER_X + 8) + 'px';
            zero.style.top = (CENTER_Y + LABEL_OFFSET) + 'px';
            gameArea.appendChild(zero);
        }
        drawAxisLabels();

        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1046.50, now);
                    osc.frequency.setValueAtTime(1318.51, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now); osc.stop(now + 0.5);
                } else if (type === 'step') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                }
            } catch (e) {}
        }

        function updatePlayerVisual() {
            player.style.left = (posX * STEP + CENTER_X) + 'px';
            player.style.top = (CENTER_Y - CAR_LIFT) + 'px';
            currentPosDisplay.innerHTML = 'X: <span class="coord-x">' + posX + '</span>';
        }

        function placeTarget() {
            // 화면에는 안 보이게 위치만 미리 잡아둠 (숫자만 보고 이동하게)
            targetMarker.style.left = (targetX * STEP + CENTER_X) + 'px';
            targetMarker.style.top = (CENTER_Y - CAR_LIFT) + 'px';
            targetMarker.style.display = 'none';
        }

        function setNewTarget() {
            // 다음 문제를 낼 때마다 자동차는 항상 원점(0)에서 다시 출발해요
            posX = 0;
            player.classList.remove('face-right');
            updatePlayerVisual();

            do {
                targetX = Math.floor(Math.random() * (X_MAX - X_MIN + 1)) + X_MIN;
            } while (targetX === 0);

            const xSign = targetX > 0 ? '+' + targetX : targetX;
            missionDisplay.innerHTML = 'X: <span class="coord-x">' + xSign + '</span>';
            placeTarget();
        }

        function startGame() {
            score = 0;
            timeLeft = 60;
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft + '초';

            startOverlay.style.display = 'none';
            howtoOverlay.style.display = 'none';
            resultOverlay.style.display = 'none';

            setNewTarget();

            playing = true;
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateTime, 1000);
        }

        function updateTime() {
            timeLeft--;
            timeDisplay.textContent = timeLeft + '초';
            if (timeLeft <= 0) endGame();
        }

        function tryMove(dx) {
            if (!playing) return;
            const nx = Math.min(X_MAX, Math.max(X_MIN, posX + dx));
            if (nx === posX) return;

            if (dx > 0) player.classList.add('face-right');
            else if (dx < 0) player.classList.remove('face-right');

            posX = nx;
            updatePlayerVisual();
            playSound('step');

            if (posX === targetX) {
                playSound('success');
                score++;
                scoreDisplay.textContent = score;
                targetMarker.style.display = 'flex'; // 도착한 순간에만 짠! 하고 깃발 등장
                setTimeout(() => {
                    targetMarker.style.display = 'none';
                    setNewTarget();
                }, 500);
            }
        }

        function endGame() {
            playing = false;
            clearInterval(gameInterval);
            document.getElementById('final-score').textContent = score;

            if (score >= 8) {
                feedbackMsg.innerHTML = "최고예요! 화살표 키와 X좌표를<br>완벽하게 연결해서 이해했어요! 🚀";
                feedbackMsg.style.color = "#ff4757";
            } else if (score >= 4) {
                feedbackMsg.innerHTML = "참 잘했어요!<br>+, - 방향을 잘 찾아냈어요! 👏";
                feedbackMsg.style.color = "#f0932b";
            } else {
                feedbackMsg.innerHTML = "좋아요!<br>→ ← 키가 X를 어떻게<br>바꾸는지 조금 더 연습해봐요! 😉";
                feedbackMsg.style.color = "#1e90ff";
            }

            if (score >= TARGET_SCORE) {
                nextBtn.style.display = 'block';
                retryBtn.style.display = 'none';
            } else {
                nextBtn.style.display = 'none';
                retryBtn.style.display = 'block';
            }

            resultOverlay.style.display = 'flex';
        }

        document.addEventListener('keydown', function (event) {
            if (['ArrowLeft', 'ArrowRight'].includes(event.key)) {
                event.preventDefault();
            }
            if (!playing) return;
            if (event.repeat) return; // 키를 꾹 눌러서 자동으로 계속 이동하는 것 방지 (한 번 누를 때마다 1칸만)

            switch (event.key) {
                case 'ArrowRight': tryMove(1); break;
                case 'ArrowLeft': tryMove(-1); break;
            }
        });

        updatePlayerVisual();
    </script>
    <script>
        // ⭐️ F12(개발자 도구) 및 관련 단축키 비활성화 - 학생들이 실수로 눌러서 화면이 이상해지는 것 방지용
        document.addEventListener('keydown', function (e) {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
            ) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
