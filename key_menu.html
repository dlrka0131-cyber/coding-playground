<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>키보드 연습 메뉴</title>
    <style>
        /* 웹 폰트 주소를 통해 폰트를 직접 불러옵니다 */
        @font-face { 
            font-family: 'ONEMobilePOP'; 
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105@1.0/ONE-Mobile-POP.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        
        body { 
            background-color: #f3f0ff; 
            color: #7b61ff;            
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            font-family: 'ONEMobilePOP', sans-serif; 
            position: relative; 
        }
        
        /* 🏠 왼쪽 상단 처음으로 버튼 */
        .home-btn {
            position: absolute; 
            top: 25px; 
            left: 25px; 
            background-color: #FFF;
            color: #7b61ff;            
            padding: 15px 30px; /* 버튼 크기도 화면 비율에 맞게 살짝 축소 */
            border-radius: 30px;
            text-decoration: none; 
            font-size: 22px; 
            font-weight: bold;
            box-shadow: 0 6px 0 #dcd6ff; 
            border: 4px solid #7b61ff;  
            font-family: 'ONEMobilePOP', sans-serif;
            z-index: 999;
        }

        /* 큰 제목 섹션 */
        .header-section { text-align: center; margin-top: 80px; margin-bottom: 20px; }
        .main-title { font-size: 70px; color: #7b61ff; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .sub-desc { font-size: 22px; background: white; padding: 12px 25px; border-radius: 40px; color: #9575cd; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* 🔥 카드가 한 줄에 들어가도록 전체 폭을 넓힘 */
        .container { 
            display: flex; 
            gap: 20px; 
            margin-top: 30px; 
            flex-wrap: wrap; 
            justify-content: center; 
            max-width: 1400px; /* 전체 카드가 들어갈 수 있도록 폭 확장 */
        }
        
        /* 🔥 카드 크기를 한 줄에 맞게 살짝 축소 */
        .card { 
            width: 220px; /* 270px -> 220px */
            height: 280px; /* 330px -> 280px */
            background: white; 
            border-radius: 50px; /* 60px -> 50px */
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 10px 30px rgba(123, 97, 255, 0.15); 
            text-decoration: none; 
            transition: 0.3s; 
            position: relative; 
        }
        .card:hover { transform: scale(1.05); }

        /* 카드 상단 이름표(태그) 글씨 및 여백 축소 */
        .badge {
            position: absolute;
            top: 20px;
            background-color: #f3edff;
            color: #7b61ff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
        }

        /* 아이콘과 제목 크기 축소 */
        .icon { font-size: 75px; margin-top: 25px; margin-bottom: 10px; }
        .title { 
            font-size: 24px; 
            color: #7b61ff;            
            font-family: 'ONEMobilePOP', sans-serif; 
        }
    </style>
</head>
<body>

    <a href="index.html" class="home-btn">🏠 처음으로</a>

    <!-- 큰 제목 섹션 -->
    <div class="header-section">
        <div class="main-title">⌨️ 키보드 놀이터</div>
        <div class="sub-desc">어떤 키보드 마법을 연습해 볼까요? 원하는 놀이를 골라보세요!</div>
    </div>

    <div class="container">
        <!-- 방금 만든 자유 연습용 키보드 (맨 처음 위치) -->
        <a href="keyboard.html" class="card">
            <div class="badge">자유 놀이</div>
            <div class="icon">👆</div> <!-- 피아노 건반에서 손가락 누르기 아이콘으로 변경 -->
            <div class="title">마카롱 키보드 </div>
        </a>

        <!-- 중요키 연습 -->
        <a href="key_easycontrol.html" class="card">
            <div class="badge">기초 다지기</div>
            <div class="icon">✨</div>
            <div class="title">중요키 연습</div>
        </a>
        
        <!-- 숫자판 연습 -->
        <a href="key_num.html" class="card">
            <div class="badge">숫자 정복</div>
            <div class="icon">🔢</div>
            <div class="title">숫자판 연습</div>
        </a>
        
        <!-- 컨트롤키 연습 -->
        <a href="key_control.html" class="card">
            <div class="badge">고수 도전</div>
            <div class="icon">🎮</div>
            <div class="title">컨트롤키 연습</div>
        </a>

        <!-- 특수키 연습 -->
        <a href="special_typing.html" class="card">
            <div class="badge">마스터 과정</div>
            <div class="icon">🔮</div>
            <div class="title">특수키 연습</div>
        </a>
    </div>

    <footer style="margin-top: 60px; color: #7b61ff; font-size: 16px; text-align: center; font-family: 'ONEMobilePOP', sans-serif;">
        제작: 김정이 선생님 ❤️ | ⓒ 2026 Coding Playground
    </footer>

</body>
</html>
